<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  .mobile-menu{position:fixed;inset:72px 0 auto 0;z-index:55;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);padding:14px 22px 24px;display:none;}
  .mobile-menu.open{display:block;}
  .mobile-menu a{display:block;padding:13px 0;font-size:16px;color:var(--fg-2);border-bottom:1px solid var(--line-2);}
  .chat-page{padding:104px 0 30px;min-height:100vh;display:flex;flex-direction:column;}
  .chat-col{width:100%;max-width:780px;margin:0 auto;padding:0 24px;flex:1;display:flex;flex-direction:column;}
  .chat-head{text-align:center;padding:18px 0 28px;}
  .chat-head h1{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.03em;
    font-size:clamp(30px,3.6vw,46px);margin-top:14px;}
  .chat-head .ground{display:inline-flex;align-items:center;gap:9px;margin-top:16px;font-size:12.5px;color:var(--fg-3);
    border:1px solid var(--line-2);background:var(--surface);padding:6px 14px;border-radius:999px;}
  .chat-head .ground b{color:var(--fg-2);font-weight:500;}
  .chat-head .ground .d{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}

  .thread{display:flex;flex-direction:column;gap:20px;padding:14px 0 26px;}
  .msg{display:flex;gap:14px;max-width:88%;}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .avatar{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .avatar.ai{background:var(--accent);color:var(--accent-ink);}
  .avatar.ai svg{width:18px;height:18px;}
  .avatar.me{background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2);font-size:13px;font-weight:600;}
  .bubble{padding:14px 18px;border-radius:16px;font-size:15px;line-height:1.6;}
  .msg.ai .bubble{background:var(--surface);border:1px solid var(--line-2);border-top-left-radius:5px;color:var(--fg);}
  .msg.user .bubble{background:color-mix(in srgb,var(--accent) 16%,var(--surface));
    border:1px solid color-mix(in srgb,var(--accent) 26%,var(--line-2));border-top-right-radius:5px;}
  .bubble .fig{display:inline-block;font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--accent);}
  .bubble .src{margin-top:10px;font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:7px;}
  .bubble .src svg{width:12px;height:12px;}
  .typing{display:flex;gap:5px;padding:4px 2px;}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--fg-3);animation:blink 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

  .composer{position:sticky;bottom:18px;background:var(--bg);padding-top:10px;}
  .chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{font-size:13px;color:var(--fg-2);background:var(--surface);border:1px solid var(--line-2);
    padding:8px 14px;border-radius:999px;cursor:pointer;transition:all .2s;}
  .chip:hover{border-color:var(--accent);color:var(--fg);}
  .inputbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:8px 8px 8px 18px;box-shadow:var(--shadow);}
  .inputbar input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font:inherit;font-size:15px;}
  .inputbar input::placeholder{color:var(--fg-3);}
  .sendbtn{width:42px;height:42px;border-radius:12px;border:none;cursor:pointer;background:var(--accent);
    color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .2s,opacity .2s;}
  .sendbtn:hover{transform:translateY(-1px);} .sendbtn:disabled{opacity:.4;cursor:default;transform:none;}
  .sendbtn svg{width:18px;height:18px;}
  @media (max-width:600px){ .msg{max-width:96%;} }
</style>
</head>
<body>

<nav class="vnav scrolled">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span>ICE&nbsp;→&nbsp;EV</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="calculator.html">Calculator</a>
      <a class="nav-link" href="snap-compare.html">Snap &amp; Compare</a>
      <a class="nav-link" href="garage.html">The Garage</a>
      <a class="nav-link active" href="concierge.html">Concierge</a>
      <a class="nav-link" href="energy-map.html">Energy Map</a>
    </div>
    <div class="nav-right">
      <div class="toggle" role="group" aria-label="Theme">
        <button data-theme-btn="light" aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
        <button data-theme-btn="dark" aria-label="Dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <a class="signin" href="auth.html">Sign in</a>
    </div>
    <button class="burger" aria-label="Menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  </div>
</nav>
<div class="mobile-menu">
  <a href="index.html">Home</a><a href="calculator.html">Calculator</a><a href="snap-compare.html">Snap &amp; Compare</a>
  <a href="garage.html">The Garage</a><a href="concierge.html">Concierge</a><a href="energy-map.html">Energy Map</a>
</div>

<div id="root"></div>

<script src="site.js"></script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const Spark = () => <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3L20 10l-5.8 1.7L12 18l-2.2-6.3L4 10l5.8-1.7L12 2z"/></svg>;
const Src = ({children}) => <div className="src"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 4h16v13H7l-3 3z"/></svg>{children}</div>;

const QA = [
  { q: 'Will an EV actually save me money?',
    a: <>Over time, yes — on running costs. Your Garage pairs a <b>VW Polo</b> against a <b>BYD Dolphin</b>: the Polo costs about <span className="fig">R57 720</span>/yr to run, the Dolphin about <span className="fig">R29 593</span>/yr. That's roughly <span className="fig">R28k</span> saved every year. The Dolphin's higher sticker price is recovered at around <span className="fig">year 3</span> on your mileage.<Src>From your Garage · 2 000 km/month</Src></> },
  { q: 'What about loadshedding?',
    a: <>Plan around it rather than fear it. A Dolphin holds ~<span className="fig">400 km</span> of range, so a typical week of <span className="fig">460 km</span> needs one or two top-ups — easily scheduled outside loadshedding windows. A small home charger plus your normal solar/UPS setup covers most stages; public DC chargers fill the gap on the road.<Src>Grounded in your usage profile</Src></> },
  { q: 'Charging on a long road trip?',
    a: <>Manageable on the main corridors. JHB–Durban or CPT–Garden Route both have DC fast chargers roughly every <span className="fig">150–200 km</span>. The Dolphin adds ~<span className="fig">80%</span> in about 30–40 minutes — one coffee stop per leg. Check the <b>Energy Map</b> to pin chargers along your exact route before you go.<Src>See Energy Map for live stations</Src></> },
  { q: 'Does resale hold up?',
    a: <>It's stabilising. EV resale was soft early on, but demand in SA is climbing and battery health reports now reassure buyers. Our model already assumes slightly steeper EV depreciation, so your <span className="fig">5-year</span> numbers are conservative — real resale may land a little better than shown.<Src>Built into your TCO estimate</Src></> },
];
const FALLBACK = <>Good question. Based on your Garage and a profile of <span className="fig">2 000 km</span>/month, the electric option pulls ahead on total cost around <span className="fig">year 3</span> and saves roughly <span className="fig">R28k</span>/yr to run. Open the <b>Calculator</b> to test your own assumptions.<Src>Grounded in your saved cars</Src></>;

function App() {
  const [msgs, setMsgs] = useState([
    { who: 'ai', body: <>Hi — I'm your switch concierge. I've read your Garage (the <b>VW Polo</b> and <b>BYD Dolphin</b>). Ask me anything about going electric in South Africa.</> },
  ]);
  const [typing, setTyping] = useState(false);
  const [val, setVal] = useState('');
  const endRef = useRef(null);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, [msgs, typing]);

  const ask = (q) => {
    const hit = QA.find((x) => x.q === q);
    setMsgs((m) => [...m, { who: 'user', body: q }]);
    setVal('');
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      setMsgs((m) => [...m, { who: 'ai', body: hit ? hit.a : FALLBACK }]);
    }, 900);
  };
  const asked = new Set(msgs.filter((m) => m.who === 'user').map((m) => m.body));
  const chips = QA.map((x) => x.q).filter((q) => !asked.has(q));

  return (
    <div className="chat-page">
      <div className="chat-col">
        <div className="chat-head">
          <div className="eyebrow" style={{justifyContent:'center'}}>Concierge <span className="pp">AI</span></div>
          <h1>Ask anything about the switch.</h1>
          <div className="ground"><span className="d"/>Grounded in your Garage · <b>VW Polo &amp; BYD Dolphin</b></div>
        </div>

        <div className="thread">
          {msgs.map((m, i) => (
            <div className={'msg ' + m.who} key={i}>
              <div className={'avatar ' + (m.who === 'ai' ? 'ai' : 'me')}>{m.who === 'ai' ? <Spark/> : 'You'}</div>
              <div className="bubble">{m.body}</div>
            </div>
          ))}
          {typing && (
            <div className="msg ai">
              <div className="avatar ai"><Spark/></div>
              <div className="bubble"><div className="typing"><i/><i/><i/></div></div>
            </div>
          )}
          <div ref={endRef} />
        </div>

        <div className="composer">
          {chips.length > 0 && (
            <div className="chips">
              {chips.map((q) => <span className="chip" key={q} onClick={() => ask(q)}>{q}</span>)}
            </div>
          )}
          <form className="inputbar" onSubmit={(e) => { e.preventDefault(); if (val.trim()) ask(val.trim()); }}>
            <input value={val} onChange={(e) => setVal(e.target.value)} placeholder="Ask about cost, charging, loadshedding, resale…" />
            <button className="sendbtn" type="submit" disabled={!val.trim()}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
