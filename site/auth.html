<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ICE → EV · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="voltage.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  body{overflow-x:hidden;}
  .auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh;}
  /* left cinematic panel */
  .auth-brand{position:relative;overflow:hidden;background:var(--bg-2);border-right:1px solid var(--line-2);
    display:flex;flex-direction:column;justify-content:space-between;padding:42px 52px;}
  .auth-band{position:absolute;top:-20%;right:-14%;width:62%;height:150%;transform:rotate(14deg);z-index:0;
    background:linear-gradient(180deg,transparent,var(--band) 45%,transparent);filter:blur(46px);opacity:.9;}
  .auth-scan{position:absolute;inset:0;z-index:0;opacity:.45;pointer-events:none;
    background:repeating-linear-gradient(100deg,transparent 0 42px,var(--line-2) 42px 43px);
    -webkit-mask-image:linear-gradient(100deg,transparent 34%,#000 92%);mask-image:linear-gradient(100deg,transparent 34%,#000 92%);}
  .auth-brand > *{position:relative;z-index:1;}
  .ab-top{display:flex;align-items:center;justify-content:space-between;}
  .ab-mid h2{font-family:'Space Grotesk',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:-0.035em;
    line-height:.86;font-size:clamp(48px,6vw,92px);}
  .ab-mid h2 .to{color:var(--fg-3);font-weight:400;}
  .ab-mid h2 .ev{color:var(--accent);}
  .ab-mid p{color:var(--fg-2);font-size:17px;max-width:380px;margin-top:22px;line-height:1.55;}
  .ab-stats{display:flex;gap:34px;margin-top:30px;}
  .ab-stats .v{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;letter-spacing:-0.02em;}
  .ab-stats .v .u{color:var(--accent);}
  .ab-stats .l{font-size:12.5px;color:var(--fg-3);margin-top:4px;}
  .ab-foot{font-size:12.5px;color:var(--fg-3);}

  /* right form panel */
  .auth-form{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px 32px;}
  .form-wrap{width:100%;max-width:392px;}
  .form-wrap .top{display:flex;justify-content:flex-end;margin-bottom:auto;}
  .seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;margin-bottom:28px;}
  .seg button{flex:1;height:42px;border-radius:9px;border:none;background:transparent;color:var(--fg-2);font:inherit;
    font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;}
  .seg button.on{background:var(--fg);color:var(--bg);}
  .form-wrap h1{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:600;letter-spacing:-0.02em;}
  .form-wrap .lead{color:var(--fg-2);font-size:14.5px;margin-top:8px;margin-bottom:26px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--fg-3);margin-bottom:7px;}
  .field .inp{display:flex;align-items:center;height:50px;padding:0 15px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg-2);transition:border-color .2s,box-shadow .2s;}
  .field .inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);}
  .field .inp svg{width:16px;height:16px;color:var(--fg-3);margin-right:11px;flex:0 0 auto;}
  .field .inp input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font:inherit;font-size:15px;}
  .field .inp .eye{margin:0 0 0 8px;cursor:pointer;}
  .row-between{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px;}
  .remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2);cursor:pointer;}
  .remember .box{width:17px;height:17px;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .remember .box.on{background:var(--accent);border-color:transparent;}
  .remember .box svg{width:11px;height:11px;color:var(--accent-ink);}
  .forgot{font-size:13px;color:var(--accent);cursor:pointer;}
  .btn-full{width:100%;justify-content:center;}
  .divider{display:flex;align-items:center;gap:14px;color:var(--fg-3);font-size:12px;margin:22px 0;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-2);}
  .socials{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .social{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
    font:inherit;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
    transition:border-color .2s;}
  .social:hover{border-color:var(--fg-3);}
  .social svg{width:17px;height:17px;}
  .legal{font-size:12px;color:var(--fg-3);text-align:center;margin-top:24px;line-height:1.6;}
  .legal a{color:var(--fg-2);text-decoration:underline;text-underline-offset:2px;}
  .brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:15px;}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--glow);}
  .mob-top{display:none;align-items:center;justify-content:space-between;margin-bottom:26px;}
  @media (max-width:880px){
    .auth{grid-template-columns:1fr;min-height:100vh;}
    .auth-brand{display:none;}
    .auth-form{padding:24px 22px;justify-content:flex-start;padding-top:38px;}
    .mob-top{display:flex;}
  }
  @media (max-width:560px){
    .socials{grid-template-columns:1fr;}
    .form-wrap h1{font-size:24px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="site.js"></script>
<script type="text/babel">
const { useState } = React;
const Mail = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>;
const Lock = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>;
const User = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="8" r="4"/><path d="M5 21c1.5-4 5-5 7-5s5.5 1 7 5"/></svg>;
const Eye = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>;
const Check = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>;
const Google = () => <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.6a4.8 4.8 0 0 1-2 3.2v2.6h3.3c1.9-1.8 3-4.4 3-7.7z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.3-2.6c-.9.6-2 .9-3.3.9-2.6 0-4.7-1.7-5.5-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.5 13.8a6 6 0 0 1 0-3.6V7.6H3.1a10 10 0 0 0 0 8.8l3.4-2.6z"/><path fill="#EA4335" d="M12 6.5c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.6L6.5 10.2C7.3 7.9 9.4 6.5 12 6.5z"/></svg>;
const Apple = () => <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.8c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7 1.3 0 1.7.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.2 1.2-2.5 1.2-2.5s-2.3-.9-2.3-3.6zM14.3 5.8c.6-.8 1-1.8.9-2.8-.9 0-2 .6-2.6 1.3-.6.7-1.1 1.7-.9 2.7 1 .1 2-.5 2.6-1.2z"/></svg>;

function App() {
  const [mode, setMode] = useState('signin');
  const [pw, setPw] = useState('');
  const [show, setShow] = useState(false);
  const [remember, setRemember] = useState(true);
  const signup = mode === 'signup';
  return (
    <div className="auth">
      <div className="auth-brand">
        <div className="auth-band"/><div className="auth-scan"/>
        <div className="ab-top">
          <a className="brand" href="index.html"><span className="dot"/>ICE&nbsp;→&nbsp;EV</a>
          <div className="toggle" role="group" aria-label="Theme">
            <button data-theme-btn="light" aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
            <button data-theme-btn="dark" aria-label="Dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
          </div>
        </div>
        <div className="ab-mid">
          <h2>Ice<br/><span className="to">to</span> <span className="ev">Ev</span></h2>
          <p>Your honest co-pilot for the switch — every rand of petrol, power and upkeep, modelled before you commit.</p>
          <div className="ab-stats">
            <div><div className="v">R76<span className="u">k</span></div><div className="l">Avg. saved / year</div></div>
            <div><div className="v">3.2<span className="u"> yr</span></div><div className="l">Typical break-even</div></div>
          </div>
        </div>
        <div className="ab-foot">© 2026 ICE → EV · Built for South African roads</div>
      </div>

      <div className="auth-form">
        <div className="form-wrap">
          <div className="mob-top">
            <a className="brand" href="index.html"><span className="dot"/>ICE&nbsp;→&nbsp;EV</a>
            <div className="toggle" role="group" aria-label="Theme">
              <button data-theme-btn="light" aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
              <button data-theme-btn="dark" aria-label="Dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
            </div>
          </div>
          <div className="seg">
            <button className={!signup?'on':''} onClick={()=>setMode('signin')}>Sign in</button>
            <button className={signup?'on':''} onClick={()=>setMode('signup')}>Create account</button>
          </div>
          <h1>{signup ? 'Start your switch.' : 'Welcome back.'}</h1>
          <div className="lead">{signup ? 'Free to use — no card, no commitment.' : 'Pick up right where you left off.'}</div>

          <form onSubmit={(e)=>e.preventDefault()}>
            {signup && (
              <div className="field">
                <label>Full name</label>
                <div className="inp"><User/><input type="text" placeholder="Thandi Mokoena" /></div>
              </div>
            )}
            <div className="field">
              <label>Email</label>
              <div className="inp"><Mail/><input type="email" placeholder="you@example.co.za" /></div>
            </div>
            <div className="field">
              <label>Password</label>
              <div className="inp"><Lock/>
                <input type={show?'text':'password'} value={pw} onChange={(e)=>setPw(e.target.value)} placeholder={signup?'At least 8 characters':'••••••••'} />
                <span className="eye" onClick={()=>setShow(!show)} style={{color:'var(--fg-3)',display:'flex'}}><Eye/></span>
              </div>
            </div>
            <div className="row-between">
              <span className="remember" onClick={()=>setRemember(!remember)}>
                <span className={'box'+(remember?' on':'')}>{remember && <Check/>}</span>
                {signup ? 'Email me switch tips' : 'Remember me'}
              </span>
              {!signup && <span className="forgot">Forgot password?</span>}
            </div>
            <a className="btn btn-accent btn-full" href="profile.html">{signup ? 'Create account' : 'Sign in'} <span className="arr">→</span></a>
          </form>

          <div className="divider">or continue with</div>
          <div className="socials">
            <button className="social"><Google/> Google</button>
            <button className="social"><Apple/> Apple</button>
          </div>
          <div className="legal">
            By continuing you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
