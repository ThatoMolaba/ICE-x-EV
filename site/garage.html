<style>
  .mobile-menu{position:fixed;inset:72px 0 auto 0;z-index:55;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);padding:14px 22px 24px;display:none;}
  .mobile-menu.open{display:block;}
  .mobile-menu a{display:block;padding:13px 0;font-size:16px;color:var(--fg-2);border-bottom:1px solid var(--line-2);}

  .feed-page{padding:104px 0 120px;}
  .feed-col{max-width:640px;margin:0 auto;padding:0 20px;}
  .feed-head{margin:8px 0 22px;}
  .feed-head .eyebrow{justify-content:flex-start;}
  .feed-head h1{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.03em;line-height:1;
    font-size:clamp(30px,4vw,46px);margin-top:12px;}
  .feed-head p{color:var(--fg-2);font-size:16px;margin-top:10px;}

  .live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg-3);margin-left:12px;}
  .live .d{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .live.off .d{background:var(--fg-3);box-shadow:none;}

  .seg{display:flex;gap:6px;margin-bottom:18px;}
  .seg button{height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--bg-2);
    color:var(--fg-2);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .2s;}
  .seg button.on{background:var(--fg);border-color:transparent;color:var(--bg);}
  .seg button:not(.on):hover{border-color:var(--fg-3);color:var(--fg);}

  /* composer */
  .composer{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:16px 16px 12px;margin-bottom:20px;}
  .composer .top{display:flex;gap:12px;}
  .av{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;}
  .av img{width:100%;height:100%;object-fit:cover;}
  .av.sm{width:34px;height:34px;border-radius:9px;font-size:12px;}
  .composer textarea{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font:inherit;font-size:16px;
    resize:none;min-height:52px;line-height:1.5;padding-top:8px;}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px 52px;}
  .thumb{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line-2);}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;
    background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--fg);display:flex;align-items:center;justify-content:center;}
  .thumb button svg{width:11px;height:11px;}
  .composer .bar{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-left:52px;}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
  .iconbtn:hover{border-color:var(--fg-3);color:var(--fg);}
  .iconbtn svg{width:18px;height:18px;}
  .post-btn{height:40px;padding:0 22px;}
  .post-btn[disabled]{opacity:.5;cursor:default;}

  .join{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:22px;margin-bottom:20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .join .tx .t{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;}
  .join .tx .s{font-size:13.5px;color:var(--fg-2);margin-top:4px;}

  /* post card */
  .post{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:18px 18px 6px;margin-bottom:16px;
    animation:rise .4s cubic-bezier(.2,.7,.2,1);}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .post.flash{border-color:color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:0 0 0 1px var(--accent);}
  .post .head{display:flex;align-items:center;gap:11px;}
  .post .head .meta{flex:1;min-width:0;}
  .post .head .nm{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;color:var(--fg);}
  .post .head .nm a{color:var(--fg);}
  .post .head .nm a:hover{color:var(--accent);}
  .post .head .vf{color:var(--accent);display:flex;}
  .post .head .vf svg{width:14px;height:14px;}
  .post .head .sub{font-size:12.5px;color:var(--fg-3);margin-top:1px;}
  .post .body{font-size:15.5px;line-height:1.55;color:var(--fg);margin:12px 0 4px;white-space:pre-wrap;word-wrap:break-word;}
  .photos{display:grid;gap:6px;margin:12px 0 4px;border-radius:14px;overflow:hidden;}
  .photos.n1{grid-template-columns:1fr;}
  .photos.n2{grid-template-columns:1fr 1fr;}
  .photos.n3{grid-template-columns:1fr 1fr;} .photos.n3 .ph:first-child{grid-row:span 2;}
  .photos.n4{grid-template-columns:1fr 1fr;}
  .ph{position:relative;background:var(--bg-2);overflow:hidden;aspect-ratio:4/3;}
  .photos.n1 .ph{aspect-ratio:16/10;}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;}

  .cmp-embed{border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line-2));border-radius:14px;padding:14px 16px;margin:12px 0 4px;
    background:color-mix(in srgb,var(--accent) 7%,var(--surface));display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .cmp-embed .t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);}
  .cmp-embed .nm{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin-top:3px;}
  .cmp-embed .win{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap;}

  .actions{display:flex;align-items:center;gap:4px;padding:8px 0 6px;border-top:1px solid var(--line-2);margin-top:12px;}
  .act{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:none;background:transparent;
    color:var(--fg-2);font:inherit;font-size:13.5px;cursor:pointer;transition:all .18s;}
  .act:hover{background:var(--bg-2);color:var(--fg);}
  .act svg{width:18px;height:18px;}
  .act.liked{color:#ff5a7a;}
  .act.liked svg{fill:#ff5a7a;stroke:#ff5a7a;}
  .act .n{font-variant-numeric:tabular-nums;}
  .spacer{flex:1;}

  /* comments */
  .comments{border-top:1px solid var(--line-2);padding:14px 0 8px;margin-top:2px;}
  .cbox{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;}
  .cbox .inp{flex:1;display:flex;gap:8px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:6px 6px 6px 14px;align-items:center;}
  .cbox .inp input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font:inherit;font-size:14px;}
  .cbox .inp button{width:34px;height:34px;border-radius:9px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .cbox .inp button:disabled{opacity:.4;cursor:default;}
  .cbox .inp button svg{width:16px;height:16px;}
  .comment{display:flex;gap:10px;margin-bottom:13px;}
  .comment .cbody{flex:1;min-width:0;}
  .comment .cmeta{font-size:12.5px;color:var(--fg-3);}
  .comment .cmeta b{color:var(--fg);font-weight:600;}
  .comment .ctext{font-size:14px;color:var(--fg);line-height:1.5;margin-top:2px;white-space:pre-wrap;word-wrap:break-word;}
  .cempty{font-size:13px;color:var(--fg-3);text-align:center;padding:6px 0 12px;}

  .state{max-width:640px;margin:160px auto;text-align:center;color:var(--fg-2);padding:0 20px;}
  .state h2{font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--fg);margin-bottom:10px;}
  .state a{color:var(--accent);}
  .state code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--bg-2);
    border:1px solid var(--line-2);border-radius:6px;padding:2px 6px;}
  .state ol{text-align:left;max-width:460px;margin:18px auto 0;padding-left:20px;font-size:14px;line-height:1.7;}

  /* demo-mode banner */
  .demo-bar{background:color-mix(in srgb,var(--warn,#d9a441) 9%,var(--surface));
    border:1px solid color-mix(in srgb,var(--warn,#d9a441) 34%,var(--line-2));
    border-radius:14px;padding:13px 15px;margin-bottom:18px;display:flex;gap:11px;align-items:flex-start;}
  .demo-bar svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px;color:var(--warn,#d9a441);}
  .demo-bar .tx{flex:1;min-width:0;}
  .demo-bar .t{font-size:13.5px;font-weight:600;color:var(--fg);}
  .demo-bar .s{font-size:12.5px;color:var(--fg-2);margin-top:3px;line-height:1.5;}
  .demo-bar .x{border:none;background:transparent;color:var(--fg-3);cursor:pointer;padding:2px;line-height:0;}
  .demo-bar .x:hover{color:var(--fg);}
  .demo-bar .x svg{width:13px;height:13px;color:inherit;}
  .post.is-demo .act{cursor:default;}
  .skeleton{height:150px;border-radius:18px;background:linear-gradient(100deg,var(--surface),var(--bg-2),var(--surface));
    background-size:200% 100%;animation:sh 1.4s infinite;margin-bottom:16px;}
  @keyframes sh{to{background-position:-200% 0;}}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--shadow);border-radius:999px;padding:11px 20px;font-size:13.5px;color:var(--fg);z-index:70;display:flex;align-items:center;gap:9px;}
  .toast .d{width:7px;height:7px;border-radius:50%;background:var(--ok);}
  @media (max-width:560px){ .feed-page{padding-top:88px;} }
</style>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const DB = window.DB;
const POST_SELECT = 'id, body, photos, comparison_id, like_count, comment_count, created_at,' +
  ' author:profiles(id,handle,display_name,avatar_url,is_verified_owner),' +
  ' comparison:comparisons(id,title,result)';
const MAX_PHOTOS = 4;

const Ico = {
  Heart: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1z"/></svg>,
  Comment: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-11.9 7.6L3 21l1.9-6A8.4 8.4 0 1 1 21 11.5z"/></svg>,
  Share: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>,
  Image: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.7"/><path d="M21 15l-5-5L5 21"/></svg>,
  X: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>,
  Send: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>,
  Verified: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l2.4 2.1 3.2-.3.9 3.1 2.6 1.9-1.3 2.9 1.3 2.9-2.6 1.9-.9 3.1-3.2-.3L12 22l-2.4-2.1-3.2.3-.9-3.1L2.9 15l1.3-2.9L2.9 9.2l2.6-1.9.9-3.1 3.2.3z"/><path d="M9 12l2 2 4-4"/></svg>,
};

function Avatar({ profile, cls }) {
  const url = DB.avatarUrl(profile);
  return <span className={'av ' + (cls || '')}>{url ? <img src={url} alt=""/> : DB.initials(profile && profile.display_name)}</span>;
}

function Composer({ me, onPosted, flash }) {
  const [body, setBody] = useState('');
  const [files, setFiles] = useState([]);   // {file, url}
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);
  const taRef = useRef(null);

  const grow = () => { const t = taRef.current; if (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 260) + 'px'; } };
  const addFiles = (list) => {
    const arr = Array.from(list).slice(0, MAX_PHOTOS - files.length)
      .filter(f => f.type.startsWith('image/'))
      .map(f => ({ file: f, url: URL.createObjectURL(f) }));
    setFiles(f => [...f, ...arr]);
  };
  const removeFile = (i) => setFiles(f => { const c = [...f]; URL.revokeObjectURL(c[i].url); c.splice(i, 1); return c; });

  const submit = async () => {
    if (busy || (!body.trim() && files.length === 0)) return;
    setBusy(true);
    try {
      let paths = [];
      for (const f of files) paths.push(await DB.upload('post-photos', f.file, me.id));
      const { data, error } = await DB.sb.from('posts')
        .insert({ author_id: me.id, body: body.trim(), photos: paths })
        .select(POST_SELECT).single();
      if (error) throw error;
      files.forEach(f => URL.revokeObjectURL(f.url));
      setBody(''); setFiles([]); if (taRef.current) taRef.current.style.height = 'auto';
      onPosted(data);
    } catch (ex) { flash('Could not post: ' + ((ex && ex.message) || ex)); }
    finally { setBusy(false); }
  };

  return (
    <div className="composer">
      <div className="top">
        <Avatar profile={me.profile} />
        <textarea ref={taRef} value={body} placeholder="Share your ride, your switch, a win at the pump…"
          onChange={(e)=>{setBody(e.target.value);grow();}} onInput={grow} />
      </div>
      {files.length > 0 && (
        <div className="thumbs">
          {files.map((f, i) => (
            <div className="thumb" key={i}><img src={f.url} alt=""/><button onClick={()=>removeFile(i)}><Ico.X/></button></div>
          ))}
        </div>
      )}
      <div className="bar">
        <div style={{display:'flex',gap:'8px'}}>
          <button className="iconbtn" title="Add photos" disabled={files.length>=MAX_PHOTOS} onClick={()=>fileRef.current.click()}><Ico.Image/></button>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={(e)=>{addFiles(e.target.files);e.target.value='';}} />
        </div>
        <button className="btn btn-accent post-btn" disabled={busy || (!body.trim() && files.length===0)} onClick={submit}>
          {busy ? 'Posting…' : 'Post'}
        </button>
      </div>
    </div>
  );
}

function Photos({ paths }) {
  if (!paths || !paths.length) return null;
  const n = Math.min(paths.length, 4);
  return (
    <div className={'photos n' + n}>
      {paths.slice(0, 4).map((p, i) => (
        <div className="ph" key={i}><img src={DB.photoUrl(p)} alt="" loading="lazy"/></div>
      ))}
    </div>
  );
}

function Comments({ post, me, flash, demo }) {
  const [list, setList] = useState(null);
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (demo) {
      setList(((window.GARAGE_DEMO && window.GARAGE_DEMO.comments) || {})[post.id] || []);
      return;
    }
    let chan;
    DB.sb.from('comments')
      .select('id, body, created_at, author:profiles(id,handle,display_name,avatar_url)')
      .eq('post_id', post.id).order('created_at', { ascending: true })
      .then(r => setList(r.data || []));
    chan = DB.sb.channel('comments:' + post.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments', filter: 'post_id=eq.' + post.id }, async (payload) => {
        const c = payload.new;
        setList(prev => {
          if (!prev || prev.some(x => x.id === c.id)) return prev;
          return [...prev, c];
        });
        // hydrate author if missing
        const a = await DB.sb.from('profiles').select('id,handle,display_name,avatar_url').eq('id', c.author_id).single();
        setList(prev => prev ? prev.map(x => x.id === c.id ? { ...x, author: a.data } : x) : prev);
      }).subscribe();
    return () => { if (chan) DB.sb.removeChannel(chan); };
  }, [post.id, demo]);

  const send = async () => {
    if (demo) { flash('Demo mode — connect Supabase to comment'); return; }
    if (!me) { location.href = 'auth.html?next=' + encodeURIComponent(location.pathname); return; }
    const text = val.trim();
    if (!text || busy) return;
    setBusy(true);
    try {
      const { data, error } = await DB.sb.from('comments')
        .insert({ post_id: post.id, author_id: me.id, body: text })
        .select('id, body, created_at, author:profiles(id,handle,display_name,avatar_url)').single();
      if (error) throw error;
      setVal('');
      setList(prev => (prev && prev.some(x => x.id === data.id)) ? prev : [...(prev || []), data]);
    } catch (ex) { flash('Could not comment'); }
    finally { setBusy(false); }
  };

  return (
    <div className="comments">
      <div className="cbox">
        <Avatar profile={me && me.profile} cls="sm" />
        <div className="inp">
          <input value={val} disabled={!me || demo}
            placeholder={demo ? 'Demo mode — comments are read-only' : me ? 'Write a comment…' : 'Sign in to comment'}
            onChange={(e)=>setVal(e.target.value)} onKeyDown={(e)=>{ if(e.key==='Enter') send(); }} />
          <button onClick={send} disabled={!val.trim() || demo}><Ico.Send/></button>
        </div>
      </div>
      {list == null ? <div className="cempty">Loading…</div>
        : list.length === 0 ? <div className="cempty">No comments yet — say something.</div>
        : list.map(c => (
          <div className="comment" key={c.id}>
            <Avatar profile={c.author} cls="sm" />
            <div className="cbody">
              <div className="cmeta"><b>{c.author ? c.author.display_name : 'Member'}</b> · {DB.timeAgo(c.created_at)}</div>
              <div className="ctext">{c.body}</div>
            </div>
          </div>
        ))}
    </div>
  );
}

function Post({ post, me, liked, onToggleLike, flash, highlight, demo }) {
  const [open, setOpen] = useState(false);
  const a = post.author || {};
  // In demo mode the profile pages have no backend to read either, so the
  // author links go nowhere rather than to a dead end.
  const href = demo ? null : ('profile.html?u=' + a.handle);
  const share = async () => {
    const url = location.origin + location.pathname + '?post=' + post.id;
    const text = (post.body || 'Check this out on The Garage').slice(0, 120);
    try {
      if (navigator.share) await navigator.share({ title: 'The Garage', text, url });
      else { await navigator.clipboard.writeText(url); flash('Link copied — share it anywhere'); }
    } catch (e) { /* user cancelled */ }
  };
  return (
    <div className={'post' + (highlight ? ' flash' : '') + (demo ? ' is-demo' : '')} id={'post-' + post.id}>
      <div className="head">
        {href ? <a href={href}><Avatar profile={a} /></a> : <Avatar profile={a} />}
        <div className="meta">
          <div className="nm">
            {href ? <a href={href}>{a.display_name || 'Member'}</a> : <span>{a.display_name || 'Member'}</span>}
            {a.is_verified_owner && <span className="vf" title="Verified EV owner"><Ico.Verified/></span>}
          </div>
          <div className="sub">@{a.handle} · {DB.timeAgo(post.created_at)}</div>
        </div>
      </div>

      {post.body && <div className="body">{post.body}</div>}
      <Photos paths={post.photos} />
      {post.comparison && (
        <a className="cmp-embed" href="calculator.html">
          <div><div className="t">Saved comparison</div><div className="nm">{post.comparison.title}</div></div>
          {post.comparison.result && post.comparison.result.winner && <div className="win">{post.comparison.result.winner} wins</div>}
        </a>
      )}

      <div className="actions">
        <button className={'act' + (liked ? ' liked' : '')} onClick={()=>onToggleLike(post)}>
          <Ico.Heart/><span className="n">{post.like_count || 0}</span>
        </button>
        <button className="act" onClick={()=>setOpen(o=>!o)}>
          <Ico.Comment/><span className="n">{post.comment_count || 0}</span>
        </button>
        <div className="spacer"/>
        <button className="act" onClick={share}><Ico.Share/>Share</button>
      </div>

      {open && <Comments post={post} me={me} flash={flash} demo={demo} />}
    </div>
  );
}

function DemoBar({ onClose }) {
  let host = '';
  try { host = new URL(window.SUPABASE_URL || '').host; } catch (e) { host = 'your Supabase project'; }
  return (
    <div className="demo-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4.5M12 17h.01"/>
      </svg>
      <div className="tx">
        <div className="t">Demo mode — these are sample posts</div>
        <div className="s">
          <b>{host}</b> isn’t responding, so the feed below is local sample data and posting is
          disabled. A free Supabase project is paused after about a week idle, which removes its
          subdomain — resume it in the dashboard, or point <b>config.local.js</b> at a new project
          and re-run <b>supabase/schema.sql</b>.
        </div>
      </div>
      <button className="x" onClick={onClose} aria-label="Dismiss"><Ico.X/></button>
    </div>
  );
}

function App() {
  const [state, setState] = useState('loading');   // loading | notconfig | ready | error
  const [errMsg, setErrMsg] = useState('');
  const [me, setMe] = useState(null);              // { id, email, profile }
  const [posts, setPosts] = useState([]);
  const [liked, setLiked] = useState(new Set());
  const [filter, setFilter] = useState('all');     // all | following
  const [followingIds, setFollowingIds] = useState(new Set());
  const [live, setLive] = useState(false);
  const [toast, setToast] = useState('');
  const [highlight, setHighlight] = useState(null);
  const [demo, setDemo] = useState(false);         // backend unreachable → sample data
  const [showBar, setShowBar] = useState(true);
  const knownIds = useRef(new Set());
  const flash = (m) => { setToast(m); clearTimeout(flash._t); flash._t = setTimeout(()=>setToast(''), 2400); };

  const loadFeed = useCallback(async (uid, follows, mode, isDemo) => {
    if (isDemo) {
      const D = window.GARAGE_DEMO || { posts: [], followingIds: [] };
      const src = mode === 'following'
        ? (D.posts || []).filter(p => (D.followingIds || []).indexOf(p.author && p.author.id) !== -1)
        : (D.posts || []);
      knownIds.current = new Set(src.map(p => p.id));
      setPosts(src);
      return;
    }
    let q = DB.sb.from('posts').select(POST_SELECT).order('created_at', { ascending: false }).limit(40);
    if (mode === 'following') {
      const ids = Array.from(follows);
      if (uid) ids.push(uid);
      q = DB.sb.from('posts').select(POST_SELECT).in('author_id', ids.length ? ids : ['00000000-0000-0000-0000-000000000000'])
            .order('created_at', { ascending: false }).limit(40);
    }
    const { data, error } = await q;
    if (error) throw error;
    knownIds.current = new Set((data || []).map(p => p.id));
    setPosts(data || []);
    if (uid && data && data.length) {
      const lk = await DB.sb.from('post_likes').select('post_id').eq('user_id', uid).in('post_id', data.map(p => p.id));
      setLiked(new Set((lk.data || []).map(r => r.post_id)));
    }
  }, []);

  const startDemo = useCallback(async () => {
    setDemo(true);
    setMe(null);
    setLive(false);
    setFilter('all');
    setFollowingIds(new Set((window.GARAGE_DEMO && window.GARAGE_DEMO.followingIds) || []));
    await loadFeed(null, null, 'all', true);
    setState('ready');
  }, [loadFeed]);

  useEffect(() => {
    let chan = null;
    (async () => {
      if (!DB || !DB.configured) { setState('notconfig'); return; }

      // A configured-but-dead project (paused/deleted → no DNS) would otherwise
      // surface as a bare "TypeError: Failed to fetch". Probe first, then fall
      // back to sample data so the community UI is still reviewable.
      if ((await DB.probe()) !== 'ok') {
        if (window.GARAGE_DEMO) await startDemo();
        else setState('unreachable');
        return;
      }

      try {
        const u = await DB.getUser();
        let profile = null, follows = new Set();
        if (u) {
          try { profile = await DB.profile(); } catch (e) {}
          const fr = await DB.sb.from('follows').select('following_id').eq('follower_id', u.id);
          follows = new Set((fr.data || []).map(r => r.following_id));
          setFollowingIds(follows);
          setMe({ id: u.id, email: u.email, profile });
        }
        await loadFeed(u && u.id, follows, 'all');
        setState('ready');

        // realtime: new posts + live counts
        chan = DB.sb.channel('feed-live')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, async (payload) => {
            const np = payload.new;
            if (knownIds.current.has(np.id)) return;
            const { data } = await DB.sb.from('posts').select(POST_SELECT).eq('id', np.id).single();
            if (!data) return;
            knownIds.current.add(np.id);
            setPosts(prev => {
              if (prev.some(p => p.id === data.id)) return prev;
              return [data, ...prev];
            });
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'posts' }, (payload) => {
            const np = payload.new;
            setPosts(prev => prev.map(p => p.id === np.id ? { ...p, like_count: np.like_count, comment_count: np.comment_count } : p));
          })
          .subscribe((status) => setLive(status === 'SUBSCRIBED'));
      } catch (ex) {
        // The project can go away between the probe and the query.
        if (DB.isNetworkError(ex) && window.GARAGE_DEMO) { await startDemo(); return; }
        setErrMsg((ex && ex.message) || String(ex));
        setState(DB.isNetworkError(ex) ? 'unreachable' : 'error');
      }
    })();
    // Returned from the effect (not the async IIFE, where it was discarded) so
    // the realtime channel is actually torn down on unmount.
    return () => { if (chan) DB.sb.removeChannel(chan); };
  }, [startDemo, loadFeed]);

  // deep-link highlight ?post=
  useEffect(() => {
    if (state !== 'ready') return;
    const id = new URLSearchParams(location.search).get('post');
    if (!id) return;
    const el = document.getElementById('post-' + id);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); setHighlight(id); setTimeout(()=>setHighlight(null), 2400); }
  }, [state, posts.length]);

  const switchFilter = async (mode) => {
    setFilter(mode); setState('loading');
    try { await loadFeed(me && me.id, followingIds, mode, demo); setState('ready'); }
    catch (ex) {
      if (DB.isNetworkError(ex) && window.GARAGE_DEMO) { await startDemo(); return; }
      setErrMsg((ex && ex.message) || String(ex));
      setState(DB.isNetworkError(ex) ? 'unreachable' : 'error');
    }
  };

  const onPosted = (post) => {
    knownIds.current.add(post.id);
    setPosts(prev => prev.some(p => p.id === post.id) ? prev : [post, ...prev]);
    flash('Posted to The Garage');
  };

  const toggleLike = async (post) => {
    if (demo) { flash('Demo mode — connect Supabase to like posts'); return; }
    if (!me) { location.href = 'auth.html?next=' + encodeURIComponent(location.pathname); return; }
    const isLiked = liked.has(post.id);
    // optimistic
    setLiked(prev => { const s = new Set(prev); isLiked ? s.delete(post.id) : s.add(post.id); return s; });
    setPosts(prev => prev.map(p => p.id === post.id ? { ...p, like_count: Math.max(0, (p.like_count||0) + (isLiked ? -1 : 1)) } : p));
    try {
      if (isLiked) await DB.sb.from('post_likes').delete().eq('post_id', post.id).eq('user_id', me.id);
      else await DB.sb.from('post_likes').insert({ post_id: post.id, user_id: me.id });
    } catch (ex) {
      // revert
      setLiked(prev => { const s = new Set(prev); isLiked ? s.add(post.id) : s.delete(post.id); return s; });
      setPosts(prev => prev.map(p => p.id === post.id ? { ...p, like_count: Math.max(0, (p.like_count||0) + (isLiked ? 1 : -1)) } : p));
      flash('Could not update like');
    }
  };

  if (state === 'notconfig') return (
    <div className="feed-page"><div className="state">
      <h2>Backend not connected</h2>
      <p>The Garage feed needs Supabase. Add your keys to <b>config.local.js</b> and run <b>supabase/schema.sql</b>. See <b>supabase/README.md</b>.</p>
    </div></div>
  );
  if (state === 'unreachable') {
    let host = '';
    try { host = new URL(window.SUPABASE_URL || '').host; } catch (e) { host = 'your Supabase project'; }
    return (
      <div className="feed-page"><div className="state">
        <h2>Can’t reach the backend</h2>
        <p><code>{host}</code> did not respond. The keys in <b>config.local.js</b> look fine, so the
           project itself is most likely paused or deleted — a free Supabase project is paused after
           about a week idle, which takes its subdomain offline.</p>
        <ol>
          <li>Open the Supabase dashboard and resume the project.</li>
          <li>If it is gone, create a new one and run <b>supabase/schema.sql</b> on it.</li>
          <li>Put the new URL and anon key in <b>site/config.local.js</b>, then reload.</li>
        </ol>
      </div></div>
    );
  }
  if (state === 'error') return (
    <div className="feed-page"><div className="state">
      <h2>Couldn’t load the feed</h2>
      <p>{errMsg}</p>
      <p style={{marginTop:'12px',fontSize:'13.5px'}}>The backend answered but the query failed —
         check that <b>supabase/schema.sql</b> has been run on this project.</p>
    </div></div>
  );

  return (
    <div className="feed-page">
      <div className="feed-col">
        <div className="feed-head">
          <div className="eyebrow">The Garage <span className="pp">Community</span>
            <span className={'live' + (live ? '' : ' off')}><span className="d"/>{live ? 'Live' : demo ? 'Demo' : 'Feed'}</span>
          </div>
          <h1>Twitter for car people.</h1>
          <p>Post your ride, swap switch stories, and see what South Africa’s drivers are moving to.</p>
        </div>

        <div className="seg">
          <button className={filter==='all'?'on':''} onClick={()=>switchFilter('all')}>For you</button>
          <button className={filter==='following'?'on':''} onClick={()=>switchFilter('following')}>Following</button>
        </div>

        {demo
          ? (showBar && <DemoBar onClose={()=>setShowBar(false)} />)
          : me
            ? <Composer me={me} onPosted={onPosted} flash={flash} />
            : <div className="join">
                <div className="tx"><div className="t">Join the conversation</div><div className="s">Sign in to post, like and comment.</div></div>
                <a className="btn btn-accent btn-sm" href={'auth.html?next=' + encodeURIComponent('garage.html')}>Sign in <span className="arr">→</span></a>
              </div>}

        {state === 'loading'
          ? <><div className="skeleton"/><div className="skeleton"/></>
          : posts.length === 0
            ? <div className="state" style={{margin:'60px auto'}}>
                <h2>{filter === 'following' ? 'Nothing here yet' : 'Be the first to post'}</h2>
                <p>{filter === 'following' ? 'Follow some members to fill this feed.' : 'Share your car or your switch story to kick things off.'}</p>
              </div>
            : posts.map(p => (
                <Post key={p.id} post={p} me={me} liked={liked.has(p.id)} onToggleLike={toggleLike}
                      flash={flash} highlight={highlight === p.id} demo={demo} />
              ))}
      </div>
      {toast && <div className="toast"><span className="d"/>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
