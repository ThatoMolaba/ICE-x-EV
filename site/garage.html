<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ICE → EV · The Garage</title>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" href="logo/mark-64.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="voltage.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  .mobile-menu{position:fixed;inset:72px 0 auto 0;z-index:55;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);padding:14px 22px 24px;display:none;}
  .mobile-menu.open{display:block;}
  .mobile-menu a{display:block;padding:13px 0;font-size:16px;color:var(--fg-2);border-bottom:1px solid var(--line-2);}

  .feed-page{padding:104px 0 120px;}
  .feed-col{max-width:640px;margin:0 auto;padding:0 20px;}
  .feed-head{margin:8px 0 22px;}
  .feed-head .eyebrow{justify-content:flex-start;}
  .feed-head h1{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.03em;line-height:1;
    font-size:clamp(30px,4vw,46px);margin-top:12px;}
  .feed-head p{color:var(--fg-2);font-size:16px;margin-top:10px;}

  .live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--fg-3);margin-left:12px;}
  .live .d{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .live.off .d{background:var(--fg-3);box-shadow:none;}

  .seg{display:flex;gap:6px;margin-bottom:18px;}
  .seg button{height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--bg-2);
    color:var(--fg-2);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .2s;}
  .seg button.on{background:var(--fg);border-color:transparent;color:var(--bg);}
  .seg button:not(.on):hover{border-color:var(--fg-3);color:var(--fg);}

  /* composer */
  .composer{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:16px 16px 12px;margin-bottom:20px;}
  .composer .top{display:flex;gap:12px;}
  .av{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;}
  .av img{width:100%;height:100%;object-fit:cover;}
  .av.sm{width:34px;height:34px;border-radius:9px;font-size:12px;}
  .composer textarea{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font:inherit;font-size:16px;
    resize:none;min-height:52px;line-height:1.5;padding-top:8px;}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px 52px;}
  .thumb{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line-2);}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;
    background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--fg);display:flex;align-items:center;justify-content:center;}
  .thumb button svg{width:11px;height:11px;}
  .composer .bar{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-left:52px;}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
  .iconbtn:hover{border-color:var(--fg-3);color:var(--fg);}
  .iconbtn svg{width:18px;height:18px;}
  .post-btn{height:40px;padding:0 22px;}
  .post-btn[disabled]{opacity:.5;cursor:default;}

  .join{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:22px;margin-bottom:20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .join .tx .t{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;}
  .join .tx .s{font-size:13.5px;color:var(--fg-2);margin-top:4px;}

  /* post card */
  .post{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:18px 18px 6px;margin-bottom:16px;
    animation:rise .4s cubic-bezier(.2,.7,.2,1);}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .post.flash{border-color:color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:0 0 0 1px var(--accent);}
  .post .head{display:flex;align-items:center;gap:11px;}
  .post .head .meta{flex:1;min-width:0;}
  .post .head .nm{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;color:var(--fg);}
  .post .head .nm a{color:var(--fg);}
  .post .head .nm a:hover{color:var(--accent);}
  .post .head .vf{color:var(--accent);display:flex;}
  .post .head .vf svg{width:14px;height:14px;}
  .post .head .sub{font-size:12.5px;color:var(--fg-3);margin-top:1px;}
  .post .body{font-size:15.5px;line-height:1.55;color:var(--fg);margin:12px 0 4px;white-space:pre-wrap;word-wrap:break-word;}
  .photos{display:grid;gap:6px;margin:12px 0 4px;border-radius:14px;overflow:hidden;}
  .photos.n1{grid-template-columns:1fr;}
  .photos.n2{grid-template-columns:1fr 1fr;}
  .photos.n3{grid-template-columns:1fr 1fr;} .photos.n3 .ph:first-child{grid-row:span 2;}
  .photos.n4{grid-template-columns:1fr 1fr;}
  .ph{position:relative;background:var(--bg-2);overflow:hidden;aspect-ratio:4/3;}
  .photos.n1 .ph{aspect-ratio:16/10;}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;}

  .cmp-embed{border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line-2));border-radius:14px;padding:14px 16px;margin:12px 0 4px;
    background:color-mix(in srgb,var(--accent) 7%,var(--surface));display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .cmp-embed .t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);}
  .cmp-embed .nm{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin-top:3px;}
  .cmp-embed .win{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap;}

  .actions{display:flex;align-items:center;gap:4px;padding:8px 0 6px;border-top:1px solid var(--line-2);margin-top:12px;}
  .act{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:none;background:transparent;
    color:var(--fg-2);font:inherit;font-size:13.5px;cursor:pointer;transition:all .18s;}
  .act:hover{background:var(--bg-2);color:var(--fg);}
  .act svg{width:18px;height:18px;}
  .act.liked{color:#ff5a7a;}
  .act.liked svg{fill:#ff5a7a;stroke:#ff5a7a;}
  .act .n{font-variant-numeric:tabular-nums;}
  .spacer{flex:1;}

  /* comments */
  .comments{border-top:1px solid var(--line-2);padding:14px 0 8px;margin-top:2px;}
  .cbox{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;}
  .cbox .inp{flex:1;display:flex;gap:8px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:6px 6px 6px 14px;align-items:center;}
  .cbox .inp input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font:inherit;font-size:14px;}
  .cbox .inp button{width:34px;height:34px;border-radius:9px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .cbox .inp button:disabled{opacity:.4;cursor:default;}
  .cbox .inp button svg{width:16px;height:16px;}
  .comment{display:flex;gap:10px;margin-bottom:13px;}
  .comment .cbody{flex:1;min-width:0;}
  .comment .cmeta{font-size:12.5px;color:var(--fg-3);}
  .comment .cmeta b{color:var(--fg);font-weight:600;}
  .comment .ctext{font-size:14px;color:var(--fg);line-height:1.5;margin-top:2px;white-space:pre-wrap;word-wrap:break-word;}
  .cempty{font-size:13px;color:var(--fg-3);text-align:center;padding:6px 0 12px;}

  /* ---------- dealerships ---------- */
  .d-tools{display:flex;gap:8px;margin-bottom:14px;}
  .d-tools input{flex:1;min-width:0;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--bg-2);
    color:var(--fg);font:inherit;font-size:13.5px;padding:0 13px;outline:none;transition:border-color .2s;}
  .d-tools input:focus{border-color:color-mix(in srgb,var(--accent) 50%,transparent);}
  .d-tools button{height:40px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:var(--bg-2);
    color:var(--fg-2);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s;}
  .d-tools button:hover{border-color:var(--fg-3);color:var(--fg);}

  .dealer{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:16px 18px;margin-bottom:12px;
    cursor:pointer;transition:border-color .2s;}
  .dealer:hover{border-color:var(--fg-3);}
  .dealer.open{border-color:color-mix(in srgb,var(--accent) 45%,transparent);cursor:default;}
  .d-top{display:flex;align-items:center;gap:13px;}
  .rank{width:34px;height:34px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;background:var(--bg-2);color:var(--fg-3);
    border:1px solid var(--line-2);}
  .rank.top{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .d-id{flex:1;min-width:0;}
  .d-id h3{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:-0.01em;}
  .d-id .sub{font-size:12.5px;color:var(--fg-3);margin-top:2px;}
  .d-score{text-align:right;flex:0 0 auto;}
  .d-score .v{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
  .d-score .n{font-size:11.5px;color:var(--fg-3);margin-top:3px;}
  .d-score .unrated{font-size:12px;color:var(--fg-3);}

  .axes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  .axis .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);display:flex;
    justify-content:space-between;gap:6px;}
  .axis .k b{color:var(--fg-2);font-variant-numeric:tabular-nums;}
  .axis .bar{height:5px;border-radius:99px;background:var(--bg-2);margin-top:5px;overflow:hidden;}
  .axis .bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.2,1);}

  .d-body{border-top:1px solid var(--line-2);margin-top:16px;padding-top:16px;}
  .d-sec{margin-bottom:20px;}
  .d-sec > h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .d-sec > h4 button{border:none;background:none;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;
    text-transform:none;letter-spacing:0;padding:0;}

  .review{border-top:1px solid var(--line-2);padding:12px 0;}
  .review:first-of-type{border-top:0;padding-top:0;}
  .review .rh{display:flex;align-items:center;gap:9px;}
  .review .rh .who{flex:1;min-width:0;font-size:13.5px;font-weight:600;}
  .review .rh .when{font-size:12px;color:var(--fg-3);}
  .review .rt{font-size:14px;line-height:1.55;color:var(--fg-2);margin-top:8px;white-space:pre-wrap;}
  .review .rax{display:flex;gap:12px;margin-top:8px;font-size:11.5px;color:var(--fg-3);}
  .review .rax b{color:var(--fg-2);}

  .sp{display:flex;align-items:flex-start;gap:11px;border-top:1px solid var(--line-2);padding:12px 0;}
  .sp:first-of-type{border-top:0;padding-top:0;}
  .sp .spb{flex:1;min-width:0;}
  .sp .spn{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .sp .cnt{font-size:11px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
    border-radius:999px;padding:2px 8px;font-weight:500;}
  .sp .nom{font-size:13px;color:var(--fg-2);line-height:1.5;margin-top:6px;padding-left:11px;
    border-left:2px solid var(--line);}
  .sp .nom .by{color:var(--fg-3);font-size:11.5px;}

  /* star control */
  .stars{display:inline-flex;gap:3px;}
  .stars button{border:none;background:none;padding:0;cursor:pointer;line-height:0;color:var(--fg-3);}
  .stars button[disabled]{cursor:default;}
  .stars svg{width:19px;height:19px;}
  .stars .on{color:var(--warn);}
  .stars.sm svg{width:14px;height:14px;}

  .rate-form{background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;padding:15px;}
  .rate-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;}
  .rate-row .k{font-size:13.5px;color:var(--fg-2);}
  .rate-form textarea{width:100%;margin-top:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:11px;
    color:var(--fg);font:inherit;font-size:14px;padding:11px 13px;resize:vertical;min-height:78px;outline:none;line-height:1.5;}
  .rate-form textarea:focus{border-color:color-mix(in srgb,var(--accent) 50%,transparent);}
  .rate-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:11px;}
  .mini-in{display:flex;gap:8px;margin-top:4px;}
  .mini-in input{flex:1;min-width:0;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);
    color:var(--fg);font:inherit;font-size:13.5px;padding:0 12px;outline:none;}
  .mini-in input:focus{border-color:color-mix(in srgb,var(--accent) 50%,transparent);}

  .state{max-width:640px;margin:160px auto;text-align:center;color:var(--fg-2);padding:0 20px;}
  .state h2{font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--fg);margin-bottom:10px;}
  .state a{color:var(--accent);}
  .state code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--bg-2);
    border:1px solid var(--line-2);border-radius:6px;padding:2px 6px;}
  .state ol{text-align:left;max-width:460px;margin:18px auto 0;padding-left:20px;font-size:14px;line-height:1.7;}

  .skeleton{height:150px;border-radius:18px;background:linear-gradient(100deg,var(--surface),var(--bg-2),var(--surface));
    background-size:200% 100%;animation:sh 1.4s infinite;margin-bottom:16px;}
  @keyframes sh{to{background-position:-200% 0;}}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--shadow);border-radius:999px;padding:11px 20px;font-size:13.5px;color:var(--fg);z-index:70;display:flex;align-items:center;gap:9px;}
  .toast .d{width:7px;height:7px;border-radius:50%;background:var(--ok);}
  @media (max-width:560px){ .feed-page{padding-top:88px;} }
</style>
</head>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const DB = window.DB;
const POST_SELECT = 'id, body, photos, comparison_id, like_count, comment_count, created_at,' +
  ' author:profiles!posts_author_id_fkey(id,handle,display_name,avatar_url,is_verified_owner),' +
  ' comparison:comparisons(id,title,result)';
const MAX_PHOTOS = 4;

const Ico = {
  Heart: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1z"/></svg>,
  Comment: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-11.9 7.6L3 21l1.9-6A8.4 8.4 0 1 1 21 11.5z"/></svg>,
  Share: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>,
  Image: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.7"/><path d="M21 15l-5-5L5 21"/></svg>,
  X: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>,
  Send: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>,
  Verified: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l2.4 2.1 3.2-.3.9 3.1 2.6 1.9-1.3 2.9 1.3 2.9-2.6 1.9-.9 3.1-3.2-.3L12 22l-2.4-2.1-3.2.3-.9-3.1L2.9 15l1.3-2.9L2.9 9.2l2.6-1.9.9-3.1 3.2.3z"/><path d="M9 12l2 2 4-4"/></svg>,
  Star: ({ filled }) => <svg viewBox="0 0 24 24" fill={filled ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>,
  Shop: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9h16v11H4z"/><path d="M9 20v-6h6v6"/></svg>,
};

/* ---------- dealership ratings ----------
   The 1-5 axes and the one-rating-per-user rule come straight from
   supabase/schema.sql: dealer_ratings(service, price, honesty, review) with a
   unique (dealer_id, user_id), plus the dealer_scores view for the averages
   the ranking sorts on. */
const AXES = [
  ['service', 'Service'],
  ['price', 'Price'],
  ['honesty', 'Honesty'],
];

function Stars({ value, onChange, small }) {
  const readOnly = !onChange;
  return (
    <span className={'stars' + (small ? ' sm' : '')} role={readOnly ? 'img' : 'radiogroup'}
          aria-label={readOnly ? (value + ' out of 5') : undefined}>
      {[1, 2, 3, 4, 5].map(n => (
        <button key={n} type="button" disabled={readOnly} className={n <= value ? 'on' : ''}
          aria-label={n + ' star' + (n > 1 ? 's' : '')}
          onClick={readOnly ? undefined : () => onChange(n)}>
          <Ico.Star filled={n <= value} />
        </button>
      ))}
    </span>
  );
}

// Average of the three axes, shown on the card and used for the ranking.
const overallOf = (s) => (s && s.avg_overall != null) ? Number(s.avg_overall) : null;

function RateForm({ mine, onSave, onCancel, busy }) {
  const [v, setV] = useState({
    service: (mine && mine.service) || 0,
    price: (mine && mine.price) || 0,
    honesty: (mine && mine.honesty) || 0,
  });
  const [review, setReview] = useState((mine && mine.review) || '');
  const complete = v.service && v.price && v.honesty;
  return (
    <div className="rate-form">
      {AXES.map(([k, label]) => (
        <div className="rate-row" key={k}>
          <span className="k">{label}</span>
          <Stars value={v[k]} onChange={(n) => setV(p => ({ ...p, [k]: n }))} />
        </div>
      ))}
      <textarea value={review} onChange={(e) => setReview(e.target.value)}
        placeholder="What was the experience actually like? Pricing, honesty, delivery, after-sales…" />
      <div className="rate-actions">
        <button className="btn btn-ghost btn-sm" onClick={onCancel}>Cancel</button>
        <button className="btn btn-accent btn-sm" disabled={!complete || busy}
          onClick={() => onSave({ ...v, review: review.trim() })}>
          {busy ? 'Saving…' : mine ? 'Update rating' : 'Post rating'}
        </button>
      </div>
      {!complete && <div style={{fontSize:'12px',color:'var(--fg-3)',marginTop:'8px'}}>Score all three to post.</div>}
    </div>
  );
}

function Avatar({ profile, cls }) {
  const url = DB.avatarUrl(profile);
  return <span className={'av ' + (cls || '')}>{url ? <img src={url} alt=""/> : DB.initials(profile && profile.display_name)}</span>;
}

function Composer({ me, onPosted, flash }) {
  const [body, setBody] = useState('');
  const [files, setFiles] = useState([]);   // {file, url}
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);
  const taRef = useRef(null);

  const grow = () => { const t = taRef.current; if (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 260) + 'px'; } };
  const addFiles = (list) => {
    const arr = Array.from(list).slice(0, MAX_PHOTOS - files.length)
      .filter(f => f.type.startsWith('image/'))
      .map(f => ({ file: f, url: URL.createObjectURL(f) }));
    setFiles(f => [...f, ...arr]);
  };
  const removeFile = (i) => setFiles(f => { const c = [...f]; URL.revokeObjectURL(c[i].url); c.splice(i, 1); return c; });

  const submit = async () => {
    if (busy || (!body.trim() && files.length === 0)) return;
    setBusy(true);
    try {
      let paths = [];
      for (const f of files) paths.push(await DB.upload('post-photos', f.file, me.id));
      const { data, error } = await DB.sb.from('posts')
        .insert({ author_id: me.id, body: body.trim(), photos: paths })
        .select(POST_SELECT).single();
      if (error) throw error;
      files.forEach(f => URL.revokeObjectURL(f.url));
      setBody(''); setFiles([]); if (taRef.current) taRef.current.style.height = 'auto';
      onPosted(data);
    } catch (ex) { flash('Could not post: ' + ((ex && ex.message) || ex)); }
    finally { setBusy(false); }
  };

  return (
    <div className="composer">
      <div className="top">
        <Avatar profile={me.profile} />
        <textarea ref={taRef} value={body} placeholder="Share your ride, your switch, a win at the pump…"
          onChange={(e)=>{setBody(e.target.value);grow();}} onInput={grow} />
      </div>
      {files.length > 0 && (
        <div className="thumbs">
          {files.map((f, i) => (
            <div className="thumb" key={i}><img src={f.url} alt=""/><button onClick={()=>removeFile(i)}><Ico.X/></button></div>
          ))}
        </div>
      )}
      <div className="bar">
        <div style={{display:'flex',gap:'8px'}}>
          <button className="iconbtn" title="Add photos" disabled={files.length>=MAX_PHOTOS} onClick={()=>fileRef.current.click()}><Ico.Image/></button>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={(e)=>{addFiles(e.target.files);e.target.value='';}} />
        </div>
        <button className="btn btn-accent post-btn" disabled={busy || (!body.trim() && files.length===0)} onClick={submit}>
          {busy ? 'Posting…' : 'Post'}
        </button>
      </div>
    </div>
  );
}

function Photos({ paths }) {
  if (!paths || !paths.length) return null;
  const n = Math.min(paths.length, 4);
  return (
    <div className={'photos n' + n}>
      {paths.slice(0, 4).map((p, i) => (
        <div className="ph" key={i}><img src={DB.photoUrl(p)} alt="" loading="lazy"/></div>
      ))}
    </div>
  );
}

function Comments({ post, me, flash }) {
  const [list, setList] = useState(null);
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    let chan;
    DB.sb.from('comments')
      .select('id, body, created_at, author:profiles(id,handle,display_name,avatar_url)')
      .eq('post_id', post.id).order('created_at', { ascending: true })
      .then(r => setList(r.data || []));
    chan = DB.sb.channel('comments:' + post.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments', filter: 'post_id=eq.' + post.id }, async (payload) => {
        const c = payload.new;
        setList(prev => {
          if (!prev || prev.some(x => x.id === c.id)) return prev;
          return [...prev, c];
        });
        // hydrate author if missing
        const a = await DB.sb.from('profiles').select('id,handle,display_name,avatar_url').eq('id', c.author_id).single();
        setList(prev => prev ? prev.map(x => x.id === c.id ? { ...x, author: a.data } : x) : prev);
      }).subscribe();
    return () => { if (chan) DB.sb.removeChannel(chan); };
  }, [post.id]);

  const send = async () => {
    if (!me) { location.href = 'auth.html?next=' + encodeURIComponent(location.pathname); return; }
    const text = val.trim();
    if (!text || busy) return;
    setBusy(true);
    try {
      const { data, error } = await DB.sb.from('comments')
        .insert({ post_id: post.id, author_id: me.id, body: text })
        .select('id, body, created_at, author:profiles(id,handle,display_name,avatar_url)').single();
      if (error) throw error;
      setVal('');
      setList(prev => (prev && prev.some(x => x.id === data.id)) ? prev : [...(prev || []), data]);
    } catch (ex) { flash('Could not comment'); }
    finally { setBusy(false); }
  };

  return (
    <div className="comments">
      <div className="cbox">
        <Avatar profile={me && me.profile} cls="sm" />
        <div className="inp">
          <input value={val} disabled={!me}
            placeholder={me ? 'Write a comment…' : 'Sign in to comment'}
            onChange={(e)=>setVal(e.target.value)} onKeyDown={(e)=>{ if(e.key==='Enter') send(); }} />
          <button onClick={send} disabled={!val.trim()}><Ico.Send/></button>
        </div>
      </div>
      {list == null ? <div className="cempty">Loading…</div>
        : list.length === 0 ? <div className="cempty">No comments yet — say something.</div>
        : list.map(c => (
          <div className="comment" key={c.id}>
            <Avatar profile={c.author} cls="sm" />
            <div className="cbody">
              <div className="cmeta"><b>{c.author ? c.author.display_name : 'Member'}</b> · {DB.timeAgo(c.created_at)}</div>
              <div className="ctext">{c.body}</div>
            </div>
          </div>
        ))}
    </div>
  );
}

function Post({ post, me, liked, onToggleLike, flash, highlight }) {
  const [open, setOpen] = useState(false);
  const a = post.author || {};
  const href = 'profile.html?u=' + a.handle;
  const share = async () => {
    const url = location.origin + location.pathname + '?post=' + post.id;
    const text = (post.body || 'Check this out on The Garage').slice(0, 120);
    try {
      if (navigator.share) await navigator.share({ title: 'The Garage', text, url });
      else { await navigator.clipboard.writeText(url); flash('Link copied — share it anywhere'); }
    } catch (e) { /* user cancelled */ }
  };
  return (
    <div className={'post' + (highlight ? ' flash' : '')} id={'post-' + post.id}>
      <div className="head">
        <a href={href}><Avatar profile={a} /></a>
        <div className="meta">
          <div className="nm">
            <a href={href}>{a.display_name || 'Member'}</a>
            {a.is_verified_owner && <span className="vf" title="Verified EV owner"><Ico.Verified/></span>}
          </div>
          <div className="sub">@{a.handle} · {DB.timeAgo(post.created_at)}</div>
        </div>
      </div>

      {post.body && <div className="body">{post.body}</div>}
      <Photos paths={post.photos} />
      {post.comparison && (
        <a className="cmp-embed" href="calculator.html">
          <div><div className="t">Saved comparison</div><div className="nm">{post.comparison.title}</div></div>
          {post.comparison.result && post.comparison.result.winner && <div className="win">{post.comparison.result.winner} wins</div>}
        </a>
      )}

      <div className="actions">
        <button className={'act' + (liked ? ' liked' : '')} onClick={()=>onToggleLike(post)}>
          <Ico.Heart/><span className="n">{post.like_count || 0}</span>
        </button>
        <button className="act" onClick={()=>setOpen(o=>!o)}>
          <Ico.Comment/><span className="n">{post.comment_count || 0}</span>
        </button>
        <div className="spacer"/>
        <button className="act" onClick={share}><Ico.Share/>Share</button>
      </div>

      {open && <Comments post={post} me={me} flash={flash} />}
    </div>
  );
}

function Dealer({ d, rank, open, onOpen, me, flash, onRated, onAddedSp }) {
  const [detail, setDetail] = useState(null);   // { reviews, sps }
  const [rating, setRating] = useState(false);
  const [busy, setBusy] = useState(false);
  const [spName, setSpName] = useState('');
  const [nomFor, setNomFor] = useState(null);
  const [nomText, setNomText] = useState('');

  const s = d.scores || {};
  const overall = overallOf(s);
  const mine = detail && me ? detail.reviews.find(r => r.author && r.author.id === me.id) : null;

  useEffect(() => {
    if (!open) return;
    let alive = true;
    (async () => {
      const [r, sp] = await Promise.all([
        DB.sb.from('dealer_ratings')
          .select('id,service,price,honesty,review,created_at,author:profiles(id,handle,display_name,avatar_url)')
          .eq('dealer_id', d.id).order('created_at', { ascending: false }),
        DB.sb.from('salespeople').select('id,name').eq('dealer_id', d.id),
      ]);
      if (!alive) return;
      const sps = sp.data || [];
      // Nominations are fetched per-dealer rather than embedded: the schema
      // links them to salespeople, not to the dealer.
      let noms = [];
      if (sps.length) {
        const n = await DB.sb.from('salesperson_nominations')
          .select('salesperson_id,reason,created_at,author:profiles(id,handle,display_name)')
          .in('salesperson_id', sps.map(x => x.id));
        noms = n.data || [];
      }
      if (!alive) return;
      setDetail({
        reviews: r.data || [],
        sps: sps.map(x => ({ ...x, noms: noms.filter(n => n.salesperson_id === x.id) })),
      });
    })();
    return () => { alive = false; };
  }, [open, d.id]);

  // Rating, adding an executive and shouting one out all require a session;
  // send a signed-out visitor to sign-in and bring them back here.
  const guard = () => {
    if (!me) { location.href = 'auth.html?next=' + encodeURIComponent('garage.html'); return false; }
    return true;
  };

  const saveRating = async (vals) => {
    if (!guard()) return;
    setBusy(true);
    try {
      // upsert on the unique (dealer_id, user_id) — one rating per person.
      const { error } = await DB.sb.from('dealer_ratings')
        .upsert({ dealer_id: d.id, user_id: me.id, ...vals }, { onConflict: 'dealer_id,user_id' });
      if (error) throw error;
      setRating(false);
      flash(mine ? 'Rating updated' : 'Thanks — rating posted');
      onRated();
    } catch (ex) { flash('Could not save: ' + ((ex && ex.message) || ex)); }
    finally { setBusy(false); }
  };

  const addSp = async () => {
    if (!spName.trim()) return;
    if (!guard()) return;
    try {
      const { error } = await DB.sb.from('salespeople').insert({ dealer_id: d.id, name: spName.trim() });
      if (error) throw error;
      setSpName(''); flash('Sales executive added'); onAddedSp(d.id);
    } catch (ex) { flash('Could not add: ' + ((ex && ex.message) || ex)); }
  };

  const nominate = async (spId) => {
    if (!nomText.trim()) return;
    if (!guard()) return;
    try {
      const { error } = await DB.sb.from('salesperson_nominations')
        .insert({ salesperson_id: spId, user_id: me.id, reason: nomText.trim() });
      if (error) throw error;
      setNomText(''); setNomFor(null); flash('Shout-out posted'); onAddedSp(d.id);
    } catch (ex) { flash('Could not post: ' + ((ex && ex.message) || ex)); }
  };

  return (
    <div className={'dealer' + (open ? ' open' : '')} onClick={open ? undefined : () => onOpen(d.id)}>
      <div className="d-top">
        <span className={'rank' + (rank <= 3 && overall != null ? ' top' : '')}>{overall == null ? '–' : rank}</span>
        <div className="d-id">
          <h3>{d.name}</h3>
          <div className="sub">{[d.brand, d.area].filter(Boolean).join(' · ')}</div>
        </div>
        <div className="d-score">
          {overall == null
            ? <div className="unrated">Not yet rated</div>
            : <>
                <div className="v">{overall.toFixed(1)}</div>
                <div className="n">{s.rating_count} rating{s.rating_count === 1 ? '' : 's'}</div>
              </>}
        </div>
      </div>

      {overall != null && (
        <div className="axes">
          {AXES.map(([k, label]) => {
            const val = s['avg_' + k] == null ? 0 : Number(s['avg_' + k]);
            return (
              <div className="axis" key={k}>
                <div className="k"><span>{label}</span><b>{val ? val.toFixed(1) : '–'}</b></div>
                <div className="bar"><i style={{ width: (val / 5 * 100) + '%' }} /></div>
              </div>
            );
          })}
        </div>
      )}

      {open && (
        <div className="d-body" onClick={(e) => e.stopPropagation()}>
          <div className="d-sec">
            <h4>
              <span>Reviews{detail ? ' · ' + detail.reviews.length : ''}</span>
              {!rating && <button onClick={() => guard() && setRating(true)}>{mine ? 'Edit your rating' : 'Rate this dealer'}</button>}
            </h4>
            {rating
              ? <RateForm mine={mine} busy={busy} onSave={saveRating} onCancel={() => setRating(false)} />
              : !detail ? <div style={{fontSize:'13px',color:'var(--fg-3)'}}>Loading…</div>
              : detail.reviews.length === 0
                ? <div style={{fontSize:'13px',color:'var(--fg-3)'}}>No reviews yet — be the first.</div>
                : detail.reviews.map(r => (
                    <div className="review" key={r.id}>
                      <div className="rh">
                        <Avatar profile={r.author} cls="sm" />
                        <span className="who">{r.author ? r.author.display_name : 'Member'}</span>
                        <span className="when">{DB.timeAgo(r.created_at)}</span>
                      </div>
                      <div className="rax">
                        {AXES.map(([k, label]) => (
                          <span key={k}>{label} <b>{r[k]}</b>/5</span>
                        ))}
                      </div>
                      {r.review && <div className="rt">{r.review}</div>}
                    </div>
                  ))}
          </div>

          <div className="d-sec">
            <h4><span>Sales executives{detail ? ' · ' + detail.sps.length : ''}</span></h4>
            {detail && detail.sps.map(sp => (
              <div className="sp" key={sp.id}>
                <Avatar profile={{ display_name: sp.name }} cls="sm" />
                <div className="spb">
                  <div className="spn">
                    {sp.name}
                    {sp.noms.length > 0 && <span className="cnt">{sp.noms.length} shout-out{sp.noms.length === 1 ? '' : 's'}</span>}
                    <button style={{border:'none',background:'none',color:'var(--accent)',font:'inherit',fontSize:'12px',cursor:'pointer',padding:0}}
                      onClick={() => { if (nomFor !== sp.id && !guard()) return; setNomFor(nomFor === sp.id ? null : sp.id); setNomText(''); }}>
                      {nomFor === sp.id ? 'Cancel' : 'Give a shout-out'}
                    </button>
                  </div>
                  {sp.noms.map((n, i) => (
                    <div className="nom" key={i}>{n.reason}
                      <div className="by">— {n.author ? n.author.display_name : 'Member'}</div>
                    </div>
                  ))}
                  {nomFor === sp.id && (
                    <div className="mini-in">
                      <input value={nomText} placeholder="What did they do well?"
                        onChange={(e) => setNomText(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter') nominate(sp.id); }} />
                      <button className="btn btn-accent btn-sm" onClick={() => nominate(sp.id)}>Post</button>
                    </div>
                  )}
                </div>
              </div>
            ))}
            <div className="mini-in" style={{ marginTop: detail && detail.sps.length ? '12px' : '0' }}>
              <input value={spName} placeholder="Add a sales executive by name…"
                onChange={(e) => setSpName(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') addSp(); }} />
              <button className="btn btn-ghost btn-sm" onClick={addSp}>Add</button>
            </div>
          </div>

          <button className="btn btn-ghost btn-sm" onClick={() => onOpen(null)}>Close</button>
        </div>
      )}
    </div>
  );
}

function Dealers({ me, flash }) {
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(null);
  const [openId, setOpenId] = useState(null);
  const [q, setQ] = useState('');
  const [adding, setAdding] = useState(false);
  const [nu, setNu] = useState({ name: '', brand: '', area: '' });
  const [tick, setTick] = useState(0);

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        // dealer_scores is a view keyed by dealer_id; PostgREST can't reliably
        // embed it, so fetch both and join on the client.
        const [d, s] = await Promise.all([
          DB.sb.from('dealers').select('id,name,brand,area'),
          DB.sb.from('dealer_scores').select('*'),
        ]);
        if (!alive) return;
        if (d.error) throw d.error;
        const byId = {};
        (s.data || []).forEach(x => { byId[x.dealer_id] = x; });
        setRows((d.data || []).map(x => ({ ...x, scores: byId[x.id] || null })));
      } catch (ex) {
        if (!alive) return;
        console.error('[garage] dealerships load failed:', ex);
        setErr(true);
      }
    })();
    return () => { alive = false; };
  }, [tick]);

  const addDealer = async () => {
    if (!me) { location.href = 'auth.html?next=' + encodeURIComponent('garage.html'); return; }
    if (!nu.name.trim()) return;
    try {
      const { error } = await DB.sb.from('dealers')
        .insert({ name: nu.name.trim(), brand: nu.brand.trim() || null, area: nu.area.trim() || null, created_by: me.id });
      if (error) throw error;
      setNu({ name: '', brand: '', area: '' }); setAdding(false);
      flash('Dealership added'); setTick(t => t + 1);
    } catch (ex) { flash('Could not add: ' + ((ex && ex.message) || ex)); }
  };

  if (err) return <div className="state" style={{margin:'60px auto'}}><h2>Couldn’t load dealerships</h2><p>Something went wrong on our side — please try again shortly.</p></div>;
  if (!rows) return <><div className="skeleton"/><div className="skeleton"/></>;

  // Ranked by overall score, then by how many people backed it. Unrated
  // dealerships sort last rather than pretending to a position.
  const term = q.trim().toLowerCase();
  const shown = rows
    .filter(d => !term || (d.name + ' ' + (d.brand || '') + ' ' + (d.area || '')).toLowerCase().includes(term))
    .slice()
    .sort((a, b) => {
      const av = overallOf(a.scores), bv = overallOf(b.scores);
      if (av == null && bv == null) return a.name.localeCompare(b.name);
      if (av == null) return 1;
      if (bv == null) return -1;
      if (bv !== av) return bv - av;
      return (b.scores.rating_count || 0) - (a.scores.rating_count || 0);
    });

  return (
    <div>
      <div className="d-tools">
        <input value={q} placeholder="Search dealerships, brand or area…" onChange={(e) => setQ(e.target.value)} />
        <button onClick={() => setAdding(a => !a)}>{adding ? 'Cancel' : '+ Dealership'}</button>
      </div>

      {adding && (
        <div className="rate-form" style={{ marginBottom: '14px' }}>
          <div className="mini-in"><input value={nu.name} placeholder="Dealership name" onChange={(e) => setNu({ ...nu, name: e.target.value })} /></div>
          <div className="mini-in" style={{ marginTop: '8px' }}>
            <input value={nu.brand} placeholder="Brand (optional)" onChange={(e) => setNu({ ...nu, brand: e.target.value })} />
            <input value={nu.area} placeholder="Area (optional)" onChange={(e) => setNu({ ...nu, area: e.target.value })} />
          </div>
          <div className="rate-actions">
            <button className="btn btn-accent btn-sm" disabled={!nu.name.trim()} onClick={addDealer}>Add dealership</button>
          </div>
        </div>
      )}

      {shown.length === 0
        ? <div className="state" style={{margin:'50px auto'}}>
            <h2>{term ? 'No match' : 'No dealerships yet'}</h2>
            <p>{term ? 'Try a different name, brand or area.' : 'Add the first one and start the ranking.'}</p>
          </div>
        : shown.map((d, i) => (
            <Dealer key={d.id} d={d} rank={i + 1} open={openId === d.id}
              onOpen={setOpenId} me={me} flash={flash}
              onRated={() => setTick(t => t + 1)} onAddedSp={() => setTick(t => t + 1)} />
          ))}
    </div>
  );
}

function App() {
  const [state, setState] = useState('loading');   // loading | notconfig | unreachable | ready | error
  const [me, setMe] = useState(null);              // { id, email, profile }
  const [posts, setPosts] = useState([]);
  const [liked, setLiked] = useState(new Set());
  const [filter, setFilter] = useState('all');     // all | following
  const [tab, setTab] = useState('feed');          // feed | dealers
  const [followingIds, setFollowingIds] = useState(new Set());
  const [live, setLive] = useState(false);
  const [toast, setToast] = useState('');
  const [highlight, setHighlight] = useState(null);
  const knownIds = useRef(new Set());
  const flash = (m) => { setToast(m); clearTimeout(flash._t); flash._t = setTimeout(()=>setToast(''), 2400); };

  const loadFeed = useCallback(async (uid, follows, mode) => {
    let q = DB.sb.from('posts').select(POST_SELECT).order('created_at', { ascending: false }).limit(40);
    if (mode === 'following') {
      const ids = Array.from(follows);
      if (uid) ids.push(uid);
      q = DB.sb.from('posts').select(POST_SELECT).in('author_id', ids.length ? ids : ['00000000-0000-0000-0000-000000000000'])
            .order('created_at', { ascending: false }).limit(40);
    }
    const { data, error } = await q;
    if (error) throw error;
    knownIds.current = new Set((data || []).map(p => p.id));
    setPosts(data || []);
    if (uid && data && data.length) {
      const lk = await DB.sb.from('post_likes').select('post_id').eq('user_id', uid).in('post_id', data.map(p => p.id));
      setLiked(new Set((lk.data || []).map(r => r.post_id)));
    }
  }, []);

  useEffect(() => {
    let chan = null;
    (async () => {
      if (!DB || !DB.configured) {
        console.error('[garage] Supabase is not configured — SUPABASE_URL / SUPABASE_ANON_KEY ' +
          'are missing or empty. On Render these are injected into site/config.local.js at build ' +
          'time from the service environment; locally, copy site/config.example.js.');
        setState('notconfig');
        return;
      }

      // A configured-but-dead project (paused/deleted → no DNS) would otherwise
      // surface as a bare "TypeError: Failed to fetch". Probe first so the
      // failure is diagnosed once rather than per query.
      if ((await DB.probe()) !== 'ok') {
        let host = '';
        try { host = new URL(window.SUPABASE_URL || '').host; } catch (e) {}
        console.error('[garage] Supabase did not respond' + (host ? ' at ' + host : '') +
          '. A free project is paused after about a week idle, which takes its subdomain offline.');
        setState('unreachable');
        return;
      }

      try {
        const u = await DB.getUser();
        let profile = null, follows = new Set();
        if (u) {
          try { profile = await DB.profile(); } catch (e) {}
          const fr = await DB.sb.from('follows').select('following_id').eq('follower_id', u.id);
          follows = new Set((fr.data || []).map(r => r.following_id));
          setFollowingIds(follows);
          setMe({ id: u.id, email: u.email, profile });
        }
        await loadFeed(u && u.id, follows, 'all');
        setState('ready');

        // realtime: new posts + live counts
        chan = DB.sb.channel('feed-live')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, async (payload) => {
            const np = payload.new;
            if (knownIds.current.has(np.id)) return;
            const { data } = await DB.sb.from('posts').select(POST_SELECT).eq('id', np.id).single();
            if (!data) return;
            knownIds.current.add(np.id);
            setPosts(prev => {
              if (prev.some(p => p.id === data.id)) return prev;
              return [data, ...prev];
            });
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'posts' }, (payload) => {
            const np = payload.new;
            setPosts(prev => prev.map(p => p.id === np.id ? { ...p, like_count: np.like_count, comment_count: np.comment_count } : p));
          })
          .subscribe((status) => setLive(status === 'SUBSCRIBED'));
      } catch (ex) {
        // The project can go away between the probe and the query.
        console.error('[garage] feed load failed:', ex);
        setState(DB.isNetworkError(ex) ? 'unreachable' : 'error');
      }
    })();
    // Returned from the effect (not the async IIFE, where it was discarded) so
    // the realtime channel is actually torn down on unmount.
    return () => { if (chan) DB.sb.removeChannel(chan); };
  }, [loadFeed]);

  // deep-link highlight ?post=
  useEffect(() => {
    if (state !== 'ready') return;
    const id = new URLSearchParams(location.search).get('post');
    if (!id) return;
    const el = document.getElementById('post-' + id);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); setHighlight(id); setTimeout(()=>setHighlight(null), 2400); }
  }, [state, posts.length]);

  const switchFilter = async (mode) => {
    setFilter(mode); setState('loading');
    try { await loadFeed(me && me.id, followingIds, mode); setState('ready'); }
    catch (ex) {
      console.error('[garage] feed filter failed:', ex);
      setState(DB.isNetworkError(ex) ? 'unreachable' : 'error');
    }
  };

  const onPosted = (post) => {
    knownIds.current.add(post.id);
    setPosts(prev => prev.some(p => p.id === post.id) ? prev : [post, ...prev]);
    flash('Posted to The Garage');
  };

  const toggleLike = async (post) => {
    if (!me) { location.href = 'auth.html?next=' + encodeURIComponent(location.pathname); return; }
    const isLiked = liked.has(post.id);
    // optimistic
    setLiked(prev => { const s = new Set(prev); isLiked ? s.delete(post.id) : s.add(post.id); return s; });
    setPosts(prev => prev.map(p => p.id === post.id ? { ...p, like_count: Math.max(0, (p.like_count||0) + (isLiked ? -1 : 1)) } : p));
    try {
      if (isLiked) await DB.sb.from('post_likes').delete().eq('post_id', post.id).eq('user_id', me.id);
      else await DB.sb.from('post_likes').insert({ post_id: post.id, user_id: me.id });
    } catch (ex) {
      // revert
      setLiked(prev => { const s = new Set(prev); isLiked ? s.add(post.id) : s.delete(post.id); return s; });
      setPosts(prev => prev.map(p => p.id === post.id ? { ...p, like_count: Math.max(0, (p.like_count||0) + (isLiked ? 1 : -1)) } : p));
      flash('Could not update like');
    }
  };

  // One visitor-facing state for every way the backend can fail. A person who
  // came to read the feed can do nothing with "run supabase/schema.sql", and
  // naming the project's host or the query error leaks deployment detail; the
  // operator's diagnosis goes to the console instead (see the effect above).
  if (state === 'notconfig' || state === 'unreachable' || state === 'error') return (
    <div className="feed-page"><div className="state">
      <h2>The Garage is unavailable</h2>
      <p>We can’t load the community feed right now. This is on our side — please try again shortly.</p>
      <button className="btn btn-accent btn-sm" style={{marginTop:'18px'}}
        onClick={() => location.reload()}>Try again</button>
    </div></div>
  );

  return (
    <div className="feed-page">
      <div className="feed-col">
        <div className="feed-head">
          <div className="eyebrow">The Garage <span className="pp">Community</span>
            <span className={'live' + (live ? '' : ' off')}><span className="d"/>{live ? 'Live' : 'Feed'}</span>
          </div>
          {tab === 'dealers'
            ? <>
                <h1>Who to buy from.</h1>
                <p>Dealerships ranked by the people who actually bought there — service, price and honesty, scored separately.</p>
              </>
            : <>
                <h1>Twitter for car people.</h1>
                <p>Post your ride, swap switch stories, and see what South Africa’s drivers are moving to.</p>
              </>}
        </div>

        <div className="seg">
          <button className={tab==='feed' && filter==='all'?'on':''} onClick={()=>{setTab('feed'); switchFilter('all');}}>For you</button>
          <button className={tab==='feed' && filter==='following'?'on':''} onClick={()=>{setTab('feed'); switchFilter('following');}}>Following</button>
          <button className={tab==='dealers'?'on':''} onClick={()=>setTab('dealers')}>Dealerships</button>
        </div>

        {tab === 'dealers'
          ? <Dealers me={me} flash={flash} />
          : <>
            {me
              ? <Composer me={me} onPosted={onPosted} flash={flash} />
              : <div className="join">
                  <div className="tx"><div className="t">Join the conversation</div><div className="s">Sign in to post, like and comment.</div></div>
                  <a className="btn btn-accent btn-sm" href={'auth.html?next=' + encodeURIComponent('garage.html')}>Sign in <span className="arr">→</span></a>
                </div>}

            {state === 'loading'
              ? <><div className="skeleton"/><div className="skeleton"/></>
              : posts.length === 0
                ? <div className="state" style={{margin:'60px auto'}}>
                    <h2>{filter === 'following' ? 'Nothing here yet' : 'Be the first to post'}</h2>
                    <p>{filter === 'following' ? 'Follow some members to fill this feed.' : 'Share your car or your switch story to kick things off.'}</p>
                  </div>
                : posts.map(p => (
                    <Post key={p.id} post={p} me={me} liked={liked.has(p.id)} onToggleLike={toggleLike}
                          flash={flash} highlight={highlight === p.id} />
                  ))}
          </>}
      </div>
      {toast && <div className="toast"><span className="d"/>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
