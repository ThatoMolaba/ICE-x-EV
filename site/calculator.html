<style>
  .mobile-menu{position:fixed;inset:72px 0 auto 0;z-index:55;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);padding:14px 22px 24px;display:none;}
  .mobile-menu.open{display:block;}
  .mobile-menu a{display:block;padding:13px 0;font-size:16px;color:var(--fg-2);border-bottom:1px solid var(--line-2);}

  .rates-note{font-size:12.5px;color:var(--fg-3);margin-top:12px;line-height:1.6;}
  .rates-note b{color:var(--fg-2);font-weight:600;}

  /* result of a paste: what came from the advert vs what we estimated */
  .urlmsg{font-size:12px;margin-top:8px;line-height:1.45;color:var(--fg-3);}
  .urlmsg.ok{color:var(--ok);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px;}
  .chip{font-size:11px;letter-spacing:.03em;text-transform:capitalize;color:var(--fg-2);
    border:1px solid var(--line-2);background:var(--bg-2);border-radius:999px;padding:3px 9px;}
  .field label .est{margin-left:6px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 34%,transparent);border-radius:4px;padding:1px 4px;}

  /* live electric alternatives (right panel) */
  /* Capped so a long list doesn't push the panel's own fields off the page. */
  .alts{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;max-height:392px;overflow-y:auto;}
  .alts::-webkit-scrollbar{width:8px;}
  .alts::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
  .alts-head{position:sticky;top:0;background:var(--surface);padding-bottom:6px;z-index:1;}
  .alts.empty{font-size:12.5px;color:var(--fg-3);line-height:1.55;border:1px dashed var(--line);
    border-radius:14px;padding:16px;}
  .alts-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px;}
  .alts-head .t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);}
  .alts-head .s{font-size:11px;color:var(--fg-3);opacity:.8;}
  .alt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg-2);
    border-radius:13px;padding:11px 13px;cursor:pointer;font:inherit;color:var(--fg);transition:all .18s;}
  .alt:hover{border-color:var(--fg-3);}
  .alt.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent);}
  .alt-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .alt-top .nm{font-size:13.5px;font-weight:500;line-height:1.3;}
  .alt-top .pr{font-size:13px;color:var(--fg-2);white-space:nowrap;}
  .alt-sub{font-size:11.5px;color:var(--fg-3);margin-top:3px;}
  .alt-delta{font-size:12px;margin-top:7px;font-weight:600;}
  .alt-delta span{font-weight:400;color:var(--fg-3);}
  .alt-delta.good{color:var(--ok);}
  .alt-delta.bad{color:var(--warn);}
  .alt-skel{height:64px;border-radius:13px;background:linear-gradient(100deg,var(--bg-2),var(--surface-2),var(--bg-2));
    background-size:200% 100%;animation:altsh 1.4s infinite;}
  @keyframes altsh{to{background-position:-200% 0;}}
</style>
