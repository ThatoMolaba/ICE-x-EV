<style>

  .scanframe .c3{bottom:14px;left:14px;border-right:0;border-top:0;}
  .scanframe .c4{bottom:14px;right:14px;border-left:0;border-top:0;}

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = (window.API_BASE || '') + '/api';

const group = (n) => Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const R = (n) => (n == null ? '—' : 'R '+group(n));
const ANNUAL_KM = 15000;   // SA average; the full calculator lets you change it
const YEARS = 5;

/* ------------------------------------------------------------------ costing */
// One place for the money, so every figure on the page agrees. Uses the live
// rates from /api/rates rather than numbers baked into the markup.

const unitPrice = (fuel, rates) =>
  fuel === 'electric' ? rates.electricity.home
  : fuel === 'diesel' ? rates.fuel.diesel50_inland
  : rates.fuel.petrol95_inland;

const unitLabel = (fuel) => fuel === 'electric' ? 'kWh/100km' : 'L/100km';

function annualRun(v, rates) {
  if (!v || v.use == null) return null;
  return Math.round((v.use / 100) * ANNUAL_KM * unitPrice(v.fuel, rates) + (v.maint || 0));
}
// Depreciation is the money the car quietly costs you even parked, so a
// five-year total that leaves it out flatters whichever car is dearer to buy.
function fiveYear(v, rates) {
  const run = annualRun(v, rates);
  if (run == null || !v.price) return null;
  const lost = Math.round(v.price * (1 - Math.pow(1 - (v.dep || 12) / 100, YEARS)));
  return lost + run * YEARS;
}

/* -------------------------------------------------------------------- image */
// Shrink before upload: a modern phone photo is 4-8MB, which is slow to send,
// slow to read, and no more accurate than a 1400px one.
function shrink(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file could not be read as an image.')); };
    img.src = url;
  });
}

// Draw the current video frame to a canvas at upload size. videoWidth/Height
// are the real sensor dimensions — the element's CSS size is whatever the
// layout made it, and using that would upload a letterboxed crop.
function grabFrame(video, maxDim, quality) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) throw new Error('The camera has not produced a frame yet.');
  const scale = Math.min(1, maxDim / Math.max(vw, vh));
  const w = Math.max(1, Math.round(vw * scale));
  const h = Math.max(1, Math.round(vh * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(video, 0, 0, w, h);
  return c.toDataURL('image/jpeg', quality);
}

const cameraSupported = () =>
  !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext;

/* ------------------------------------------------------------------- pieces */

const Trophy = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M6 4h12v4a6 6 0 0 1-12 0V4z"/><path d="M6 6H3v2a3 3 0 0 0 3 3M18 6h3v2a3 3 0 0 1-3 3M9 20h6M12 14v6"/></svg>;
const Ext = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>;
const Redo = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>;

const CarSilh = () => (
  <svg viewBox="0 0 120 50" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round">
    <path d="M6 38h108M14 38c0-14 10-20 20-22 8-1.5 16-6 26-6 14 0 22 6 30 12l16 4c4 1 6 4 6 8v4"/>
    <circle cx="34" cy="40" r="7" fill="var(--bg)"/><circle cx="92" cy="40" r="7" fill="var(--bg)"/>
  </svg>
);

const XIco = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>;
const FlipIco = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>;

/* --------------------------------------------------------------- the camera */
// A live viewfinder rather than <input capture>: that only opens the native
// camera app on a phone and degrades to a plain file picker on a laptop, which
// is where most people will first try this.
function Camera({ onCapture, onClose, onFallback }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [facing, setFacing] = useState('environment');
  const [ready, setReady] = useState(false);
  const [multi, setMulti] = useState(false);
  const [flash, setFlash] = useState(false);
  const [camErr, setCamErr] = useState('');

  // Stopping every track matters: without it the camera stays powered and the
  // recording indicator stays lit after the component goes away.
  const stop = useCallback(() => {
    const s = streamRef.current;
    if (s) { s.getTracks().forEach((t) => t.stop()); streamRef.current = null; }
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setReady(false); setCamErr('');
      stop();
      try {
        // `ideal` rather than `exact` so a laptop with only a front camera still
        // opens instead of throwing OverconstrainedError.
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false,
        });
        if (cancelled) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        const el = videoRef.current;
        if (el) {
          el.srcObject = stream;
          // iOS Safari refuses to play inline without both of these.
          el.setAttribute('playsinline', '');
          el.muted = true;
          try { await el.play(); } catch (e) { /* autoplay policy; the poster still shows */ }
        }
        if (!cancelled) setReady(true);

        // Only offer the flip control when there is somewhere to flip to.
        try {
          const devs = await navigator.mediaDevices.enumerateDevices();
          if (!cancelled) setMulti(devs.filter((d) => d.kind === 'videoinput').length > 1);
        } catch (e) { /* label/permission quirks — the control just stays hidden */ }
      } catch (ex) {
        if (cancelled) return;
        const name = ex && ex.name;
        setCamErr(
          name === 'NotAllowedError' || name === 'SecurityError'
            ? 'Camera access was blocked. Allow it in your browser’s site settings, or choose a photo instead.'
          : name === 'NotFoundError' || name === 'OverconstrainedError'
            ? 'No camera was found on this device.'
          : name === 'NotReadableError'
            ? 'The camera is already in use by another app. Close that and try again.'
          : 'The camera could not be started.'
        );
      }
    })();
    return () => { cancelled = true; stop(); };
  }, [facing, stop]);

  const shoot = () => {
    const el = videoRef.current;
    if (!el || !ready) return;
    let dataUrl;
    try {
      dataUrl = grabFrame(el, 1400, 0.82);
    } catch (ex) {
      setCamErr(ex.message);
      return;
    }
    setFlash(true);
    setTimeout(() => setFlash(false), 340);
    stop();               // release the camera before the upload starts
    onCapture(dataUrl);
  };

  if (camErr) {
    return (
      <div className="drop">
        <h3>Camera unavailable</h3>
        <p>{camErr}</p>
        <div className="acts">
          <button className="btn btn-accent" onClick={onFallback}>Choose a photo</button>
          <button className="btn" onClick={onClose}>Back</button>
        </div>
      </div>
    );
  }

  return (
    <div className={'cam' + (facing === 'user' ? ' user' : '')}>
      <video ref={videoRef} playsInline muted autoPlay/>
      {!ready && <div className="camloading">Starting camera…</div>}
      <div className="guide"><span className="g1"/><span className="g2"/><span className="g3"/><span className="g4"/></div>
      <div className="tip">Fit the whole car in frame — include the windscreen price sticker if there is one</div>
      <div className={'camflash' + (flash ? ' on' : '')}/>
      <div className="bar">
        <div className="side">
          <button className="cambtn" onClick={onClose} aria-label="Close camera"><XIco/></button>
        </div>
        <button className="shutter" onClick={shoot} disabled={!ready} aria-label="Take photo"/>
        <div className="side">
          {multi && (
            <button className="cambtn" aria-label="Switch camera"
                    onClick={() => setFacing((f) => (f === 'environment' ? 'user' : 'environment'))}>
              <FlipIco/>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function Lens({ car, ev, photo, busy, badge, onRescan, rates }) {
  const est = (k) => car && car.estimated && car.estimated.indexOf(k) !== -1;
  return (
    <div className={'lens' + (ev ? ' ev' : '')}>
      <div className={'scanframe' + (busy ? ' busy' : '')}>
        {photo
          ? <img className="shot" src={photo} alt=""/>
          : car && car.image
            ? <img className="shot" src={car.image} alt=""/>
            : <div className="silh"><CarSilh/></div>}
        <span className="corner c1"/><span className="corner c2"/><span className="corner c3"/><span className="corner c4"/>
        {busy && <div className="scanline"/>}
        {badge && <span className="scanbadge">{badge}</span>}
      </div>
      <div className="lens-body">
        <div className="row1">
          <h3>{car ? car.name : (ev ? 'No alternative yet' : 'Nothing scanned yet')}</h3>
          <span className="tag">{ev ? 'Electric' : 'Scanned'}</span>
        </div>
        {car && (
          <div className="chips">
            <span className={'chip' + (ev ? ' ev' : '')}>{car.fuel}</span>
            {car.year && <span className="chip">{car.years && car.years[0] !== car.years[1] ? car.years[0] + '–' + car.years[1] : car.year}</span>}
            {car.use != null && <span className="chip">{car.use} {unitLabel(car.fuel)}{est('use') && <span className="est">est</span>}</span>}
            {car.body && <span className="chip">{car.body}</span>}
          </div>
        )}
      </div>
      <div className="lens-foot">
        <span className="display" style={{fontSize:'22px'}}>{car ? R(car.price) : '—'}</span>
        {onRescan && <span className="rescan" onClick={onRescan}><Redo/>Rescan</span>}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- app */

function App() {
  const [stage, setStage] = useState('idle');      // idle | scanning | ready | error
  const [photo, setPhoto] = useState(null);
  const [res, setRes] = useState(null);
  const [err, setErr] = useState('');
  const [rates, setRates] = useState(null);
  const [pick, setPick] = useState(0);
  const [prio, setPrio] = useState('running');
  const [variant, setVariant] = useState('');
  const [over, setOver] = useState(false);
  const fileRef = useRef(null);
  const camRef = useRef(null);
  // Computed once: getUserMedia needs a secure context, so this is false on
  // plain http and we fall back to the native picker rather than a dead button.
  const [canCamera] = useState(cameraSupported);

  useEffect(() => {
    fetch(API + '/rates')
      .then((r) => r.ok ? r.json() : null)
      .then((d) => d && setRates(d))
      .catch(() => {});
  }, []);

  // The camera hands us an already-sized data URL, the file inputs hand us a
  // File; both end up here, so there is one upload path to reason about.
  const scanDataUrl = useCallback(async (dataUrl) => {
    setErr(''); setRes(null); setPick(0); setVariant('');
    setPhoto(dataUrl);
    setStage('scanning');
    try {
      const r = await fetch(API + '/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl.split(',')[1], mime: 'image/jpeg' }),
      });
      const d = await r.json().catch(() => null);
      if (!r.ok) {
        setErr((d && d.message) || 'That scan did not work. Try again.');
        setStage('error');
        return;
      }
      setRes(d);
      setVariant(d.vehicle.variant || '');
      setStage('ready');
    } catch (ex) {
      setErr('Could not reach the scanner. Check your connection and try again.');
      setStage('error');
    }
  }, []);

  const scan = useCallback(async (file) => {
    if (!file) return;
    let dataUrl;
    try {
      dataUrl = await shrink(file, 1400, 0.82);
    } catch (ex) {
      setPhoto(null); setErr(ex.message); setStage('error'); return;
    }
    scanDataUrl(dataUrl);
  }, [scanDataUrl]);

  const onDrop = (e) => {
    e.preventDefault(); setOver(false);
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) scan(f);
  };

  const reset = () => { setStage('idle'); setPhoto(null); setRes(null); setErr(''); };
  const openCamera = () => { setErr(''); setStage('camera'); };

  const busy = stage === 'scanning';
  const v = res && res.vehicle;
  const alts = (res && res.alternatives) || [];
  const alt = alts.length ? alts[Math.min(pick, alts.length - 1)] : null;

  // Only compare once both sides and the rates exist — a half-populated table
  // that fills in later reads as a wrong answer.
  const canCompare = !!(v && alt && rates && v.price && alt.price);
  const aRun = canCompare ? annualRun(v, rates) : null;
  const bRun = canCompare ? annualRun(alt, rates) : null;
  const aTot = canCompare ? fiveYear(v, rates) : null;
  const bTot = canCompare ? fiveYear(alt, rates) : null;

  const rows = canCompare ? [
    { k:'Upfront price', a:R(v.price), b:R(alt.price), aw:v.price < alt.price, metric:'price' },
    { k:'Drivetrain', a:v.fuel, b:alt.fuel, aw:null, metric:null },
    { k:'Efficiency', a:v.use + ' ' + unitLabel(v.fuel), b:alt.use + ' ' + unitLabel(alt.fuel), aw:null, metric:null },
    { k:'Running cost', a:R(aRun), b:R(bRun), as:'/ year', bs:'/ year', aw:aRun < bRun, metric:'running' },
    { k:'5-year total', a:R(aTot), b:R(bTot), as:'incl. depreciation', bs:'incl. depreciation', aw:aTot < bTot, metric:'total' },
  ] : [];

  const verdict = () => {
    if (!canCompare) return null;
    const pairs = {
      price:   [v.price, alt.price, 'cheaper to buy today'],
      running: [aRun, bRun, 'cheaper to run every year'],
      total:   [aTot, bTot, 'cheaper across five years'],
    };
    const [a, b, txt] = pairs[prio];
    const aWins = a < b;
    return { who: aWins ? v.name : alt.name, d: R(Math.abs(a - b)), txt };
  };
  const w = verdict();

  return (
    <div className="app-page">
      <div className="wrap">
        <div className="app-head">
          <div className="eyebrow">Snap &amp; Compare <span className="pp">Vision</span></div>
          <h1>Point. Shoot. Know.</h1>
          <p>Photograph any car and we'll tell you what it is, what it really costs to run,
             where you can buy one today — and the electric alternative, costed against it.</p>
        </div>

        <input ref={fileRef} type="file" accept="image/*" hidden
               onChange={(e) => scan(e.target.files && e.target.files[0])}/>
        <input ref={camRef} type="file" accept="image/*" capture="environment" hidden
               onChange={(e) => scan(e.target.files && e.target.files[0])}/>

        {stage === 'idle' && (
          <div className={'drop' + (over ? ' over' : '')}
               onDragOver={(e)=>{e.preventDefault(); setOver(true);}}
               onDragLeave={()=>setOver(false)} onDrop={onDrop}>
            <h3>Scan a car</h3>
            <p>A three-quarter view works best. If it's on a forecourt, get the windscreen
               price sticker in frame — that's the most reliable read by far.</p>
            <div className="acts">
              {canCamera
                ? <button className="btn btn-accent" onClick={openCamera}>Open camera</button>
                : <button className="btn btn-accent" onClick={()=>camRef.current && camRef.current.click()}>Take a photo</button>}
              <button className="btn" onClick={()=>fileRef.current && fileRef.current.click()}>Choose a photo</button>
            </div>
            <div className="hint">
              {canCamera ? 'Or drop an image here.'
                         : 'Live camera needs a secure (https) connection — drop an image here instead.'}
            </div>
          </div>
        )}

        {stage === 'camera' && (
          <Camera onCapture={scanDataUrl} onClose={reset}
                  onFallback={()=>{ reset(); setTimeout(()=>fileRef.current && fileRef.current.click(), 0); }}/>
        )}

        {stage === 'error' && (
          <div className="drop">
            <h3>That didn't work</h3>
            <p>{err}</p>
            <div className="acts">
              {canCamera
                ? <button className="btn btn-accent" onClick={openCamera}>Take another</button>
                : <button className="btn btn-accent" onClick={()=>camRef.current && camRef.current.click()}>Take another</button>}
              <button className="btn" onClick={()=>fileRef.current && fileRef.current.click()}>Choose a photo</button>
              <button className="btn" onClick={reset}>Start over</button>
            </div>
          </div>
        )}

        {(busy || stage === 'ready') && (
          <>
            <div className="lenses">
              <Lens car={v} photo={photo} busy={busy} rates={rates}
                    badge={busy ? 'Reading…' : (v && v.source === 'sticker' ? 'Read from sticker' : 'Identified')}
                    onRescan={busy ? null : reset}/>
              <Lens car={alt} ev rates={rates}
                    badge={alt ? 'Electric alternative' : null}/>
            </div>

            {stage === 'ready' && v && (
              <>
                <div className="priobar">
                  <span className="lbl">
                    {v.name}
                    <span className={'conf ' + v.confidence} style={{marginLeft:'10px'}}>{v.confidence} confidence</span>
                  </span>
                </div>

                {!v.variant_confirmed && (
                  <div className="askbar">
                    <div className="tx">
                      <div className="t">Which variant is it?</div>
                      <div className="s">Trim moves the price more than anything else, and it usually
                         can't be read off a photo. Correct this and the figures follow.</div>
                    </div>
                    <input value={variant} placeholder="e.g. 1.0 TSI Comfortline"
                           onChange={(e)=>setVariant(e.target.value)}/>
                  </div>
                )}

                {alts.length > 1 && (
                  <div className="altpick">
                    {alts.map((a, i) => (
                      <button key={a.id || i} className={i === pick ? 'on' : ''} onClick={()=>setPick(i)}>
                        {a.name} · {R(a.price)}
                      </button>
                    ))}
                  </div>
                )}

                {canCompare ? (
                  <>
                    <div className="priobar" style={{marginTop:'18px'}}>
                      <span className="lbl">What matters most to you?</span>
                      <div className="seg">
                        {[['price','Upfront price'],['running','Running cost'],['total','5-year total']].map(([k,l]) => (
                          <button key={k} className={prio===k?'on':''} onClick={()=>setPrio(k)}>{l}</button>
                        ))}
                      </div>
                    </div>

                    <div className="cmp">
                      {rows.map((r) => {
                        const aWin = r.aw === true, bWin = r.aw === false;
                        const dim = r.metric && r.metric !== prio;
                        return (
                          <div className="cmp-row" key={r.k}>
                            <div className={'cmp-cell right' + (aWin ? ' win' : '')} style={dim?{opacity:.62}:null}>
                              {r.a}{r.as && <span className="sub">{r.as}</span>}
                            </div>
                            <div className="mid">{r.k}</div>
                            <div className={'cmp-cell' + (bWin ? ' win' : '')} style={dim?{opacity:.62}:null}>
                              {r.b}{r.bs && <span className="sub">{r.bs}</span>}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {w && (
                      <div className="verdict">
                        <div className="ic"><Trophy/></div>
                        <div className="tx">
                          <div className="k">Verdict · by {prio === 'price' ? 'upfront price' : prio === 'running' ? 'running cost' : '5-year total'}</div>
                          <div className="v">The <b>{w.who}</b> wins — {w.d} {w.txt}.</div>
                        </div>
                        <a className="btn btn-accent" href="calculator.html">Model it fully <span className="arr">→</span></a>
                      </div>
                    )}
                  </>
                ) : (
                  <div className="cmp"><div className="empty">
                    {!alt ? 'No electric stock is listed to compare against right now.'
                          : 'Not enough price information to compare these two yet.'}
                  </div></div>
                )}

                <div className="sect">
                  <h2>Where to buy one</h2>
                  <div className="sub">Live listings on AutoTrader, newest first.</div>
                  {res.buy && res.buy.length ? (
                    <>
                      <div className="buylist">
                        {res.buy.map((b) => (
                          <a className="buyrow" key={b.id} href={b.url} target="_blank" rel="noopener noreferrer">
                            <div className="nm">
                              <b>{b.year ? b.year + ' ' : ''}{b.name}</b>
                              <span>{[b.condition, b.transmission, b.fuel].filter(Boolean).join(' · ')}</span>
                            </div>
                            <div className="pr">{R(b.price)}</div>
                            <div className="go"><Ext/></div>
                          </a>
                        ))}
                      </div>
                      {res.searchUrl && (
                        <div className="altpick">
                          <a className="btn" href={res.searchUrl} target="_blank" rel="noopener noreferrer">
                            See all on AutoTrader <span className="arr">→</span>
                          </a>
                        </div>
                      )}
                    </>
                  ) : (
                    <div className="buylist"><div className="empty">
                      Nothing matching is listed for sale right now.
                    </div></div>
                  )}
                </div>

                {res.notes && res.notes.length > 0 && (
                  <ul className="notes">
                    {res.notes.map((n, i) => <li key={i}>{n}</li>)}
                  </ul>
                )}
                {rates && (
                  <ul className="notes">
                    <li>Costed at {ANNUAL_KM.toLocaleString('en-ZA')} km/year, using rates as of {rates.asOf}.
                        Figures marked <span className="est">est</span> are our estimates, not from the advert.</li>
                  </ul>
                )}
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
