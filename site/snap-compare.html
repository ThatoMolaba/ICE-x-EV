<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ICE → EV · Snap &amp; Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="voltage.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  .mobile-menu{position:fixed;inset:72px 0 auto 0;z-index:55;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);padding:14px 22px 24px;display:none;}
  .mobile-menu.open{display:block;}
  .mobile-menu a{display:block;padding:13px 0;font-size:16px;color:var(--fg-2);border-bottom:1px solid var(--line-2);}
  .app-page{padding:118px 0 100px;position:relative;}
  .app-head{margin-bottom:40px;max-width:680px;}
  .app-head h1{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.03em;line-height:1;
    font-size:clamp(34px,4.4vw,58px);margin-top:16px;}
  .app-head p{color:var(--fg-2);font-size:18px;margin-top:14px;}

  .lenses{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
  .lens{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;overflow:hidden;}
  .lens.ev{border-color:color-mix(in srgb,var(--accent) 26%,var(--line-2));}
  .scanframe{position:relative;aspect-ratio:16/10;overflow:hidden;
    background:radial-gradient(120% 120% at 30% 20%,#23262e,#0d0f13);}
  [data-theme="light"] .scanframe{background:radial-gradient(120% 120% at 30% 20%,#e9eaee,#cfd2d8);}
  .scanframe .silh{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;}
  .scanframe .silh svg{width:78%;height:78%;opacity:.5;color:var(--fg-3);}
  .scanframe .corner{position:absolute;width:22px;height:22px;border:2px solid var(--accent);opacity:.85;}
  .scanframe .c1{top:14px;left:14px;border-right:0;border-bottom:0;}
  .scanframe .c2{top:14px;right:14px;border-left:0;border-bottom:0;}
  .scanframe .c3{bottom:14px;left:14px;border-right:0;border-top:0;}
  .scanframe .c4{bottom:14px;right:14px;border-left:0;border-top:0;}
  .scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);
    box-shadow:0 0 14px var(--glow);animation:scan 3.4s ease-in-out infinite;opacity:.9;}
  @keyframes scan{0%,100%{top:12%;}50%{top:86%;}}
  @media (prefers-reduced-motion:reduce){.scanline{animation:none;top:50%;}}
  .scanbadge{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--bg) 70%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);padding:4px 10px;border-radius:999px;backdrop-filter:blur(8px);}
  .lens-body{padding:20px 22px;}
  .lens-body .row1{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .lens-body h3{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;letter-spacing:-0.01em;
    flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lens-body .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);}
  .chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .chip{font-size:12px;color:var(--fg-2);background:var(--bg-2);border:1px solid var(--line-2);
    padding:5px 11px;border-radius:999px;}
  .chip.ev{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);}
  .lens-foot{display:flex;align-items:center;justify-content:space-between;padding:0 22px 18px;}
  .rescan{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--fg-2);cursor:pointer;}
  .rescan svg{width:14px;height:14px;}

  .priobar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:8px 0 18px;}
  .priobar .lbl{font-size:13.5px;color:var(--fg-2);}
  .priobar .seg{display:flex;gap:6px;}
  .priobar .seg button{height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--bg-2);
    color:var(--fg-2);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .2s;}
  .priobar .seg button.on{background:var(--accent);border-color:transparent;color:var(--accent-ink);}
  .priobar .seg button:not(.on):hover{border-color:var(--fg-3);color:var(--fg);}

  .cmp{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;overflow:hidden;margin-bottom:18px;}
  .cmp-row{display:grid;grid-template-columns:1fr 200px 1fr;align-items:center;border-top:1px solid var(--line-2);}
  .cmp-row:first-child{border-top:0;}
  .cmp-row .mid{text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:16px 8px;}
  .cmp-cell{padding:16px 24px;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:500;
    font-variant-numeric:tabular-nums;color:var(--fg-2);transition:color .25s,background .25s;}
  .cmp-cell.right{text-align:right;}
  .cmp-cell.win{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);}
  .cmp-cell .sub{display:block;font-family:'Inter';font-size:11.5px;font-weight:400;color:var(--fg-3);margin-top:3px;}

  .verdict{display:flex;align-items:center;gap:22px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface));
    border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line-2));border-radius:20px;padding:24px 28px;flex-wrap:wrap;}
  .verdict .ic{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .verdict .ic svg{width:24px;height:24px;}
  .verdict .tx{flex:1;min-width:220px;}
  .verdict .tx .k{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);}
  .verdict .tx .v{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;letter-spacing:-0.01em;margin-top:4px;}
  .verdict .tx .v b{color:var(--accent);}
  @media (max-width:900px){
    .lenses{grid-template-columns:1fr;}
    .cmp-row{grid-template-columns:1fr 90px 1fr;}
    .cmp-cell{padding:14px;font-size:15px;}
  }
</style>
</head>
<body>

<nav class="vnav scrolled">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span>ICE&nbsp;→&nbsp;EV</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="calculator.html">Calculator</a>
      <a class="nav-link active" href="snap-compare.html">Snap &amp; Compare</a>
      <a class="nav-link" href="garage.html">The Garage</a>
      <a class="nav-link" href="concierge.html">Concierge</a>
      <a class="nav-link" href="energy-map.html">Energy Map</a>
    </div>
    <div class="nav-right">
      <div class="toggle" role="group" aria-label="Theme">
        <button data-theme-btn="light" aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
        <button data-theme-btn="dark" aria-label="Dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <a class="signin" href="auth.html">Sign in</a>
    </div>
    <button class="burger" aria-label="Menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  </div>
</nav>
<div class="mobile-menu">
  <a href="index.html">Home</a><a href="calculator.html">Calculator</a><a href="snap-compare.html">Snap &amp; Compare</a>
  <a href="garage.html">The Garage</a><a href="concierge.html">Concierge</a><a href="energy-map.html">Energy Map</a>
</div>

<div id="root"></div>

<script src="site.js"></script>
<script type="text/babel">
const { useState } = React;
const group = (n) => Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const R = (n) => 'R '+group(n);

const CarSilh = () => (
  <svg viewBox="0 0 120 50" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round">
    <path d="M6 38h108M14 38c0-14 10-20 20-22 8-1.5 16-6 26-6 14 0 22 6 30 12l16 4c4 1 6 4 6 8v4"/>
    <circle cx="34" cy="40" r="7" fill="var(--bg)"/><circle cx="92" cy="40" r="7" fill="var(--bg)"/>
  </svg>
);

const A = { name:'VW Polo 1.0 TSI', kind:'ICE', year:'2024', price:374900, drive:'Petrol · Manual', eff:'6.5 L/100km', fuelCost:'R 24.50 / L', run:57720, tco5:663500 };
const B = { name:'BYD Dolphin Comfort', kind:'EV', year:'2024', price:539900, drive:'Electric · Auto', eff:'15.9 kWh/100km', fuelCost:'R 3.30 / kWh', run:29593, tco5:687865 };

function Lens({ car, ev }) {
  return (
    <div className={'lens' + (ev ? ' ev' : '')}>
      <div className="scanframe">
        <div className="silh"><CarSilh/></div>
        <span className="corner c1"/><span className="corner c2"/><span className="corner c3"/><span className="corner c4"/>
        <div className="scanline"/>
        <span className="scanbadge">{ev ? 'Scanned · EV' : 'Scanned · ICE'}</span>
      </div>
      <div className="lens-body">
        <div className="row1">
          <h3>{car.name}</h3>
          <span className="tag">Car {ev ? 'B' : 'A'}</span>
        </div>
        <div className="chips">
          <span className={'chip' + (ev ? ' ev' : '')}>{car.drive}</span>
          <span className="chip">{car.year}</span>
          <span className="chip">{car.eff}</span>
        </div>
      </div>
      <div className="lens-foot">
        <span className="display" style={{fontSize:'22px'}}>{R(car.price)}</span>
        <span className="rescan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Rescan</span>
      </div>
    </div>
  );
}

const Trophy = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M6 4h12v4a6 6 0 0 1-12 0V4z"/><path d="M6 6H3v2a3 3 0 0 0 3 3M18 6h3v2a3 3 0 0 1-3 3M9 20h6M12 14v6"/></svg>;

function App() {
  const [prio, setPrio] = useState('running');
  const rows = [
    { k:'Upfront price', a:R(A.price), b:R(B.price), aw:A.price<B.price, metric:'price' },
    { k:'Drivetrain', a:A.drive, b:B.drive, aw:null, metric:null },
    { k:'Efficiency', a:A.eff, b:B.eff, aw:null, metric:null },
    { k:'Running cost', a:R(A.run), b:R(B.run), as:'/ year', bs:'/ year', aw:A.run<B.run, metric:'running' },
    { k:'5-year total', a:R(A.tco5), b:R(B.tco5), aw:A.tco5<B.tco5, metric:'total' },
  ];
  const wins = {
    price: { who:'VW Polo', d:R(Math.abs(A.price-B.price)), txt:'cheaper to buy today' },
    running: { who:'BYD Dolphin', d:R(Math.abs(A.run-B.run)), txt:'cheaper to run every year' },
    total: { who:'VW Polo', d:R(Math.abs(A.tco5-B.tco5)), txt:'cheaper across five years' },
  };
  const w = wins[prio];
  return (
    <div className="app-page">
      <div className="wrap">
        <div className="app-head">
          <div className="eyebrow">Snap &amp; Compare <span className="pp">Vision</span></div>
          <h1>Two cars, one glance.</h1>
          <p>Point your camera at any two cars on the forecourt. We read the badges and put the real numbers side by side.</p>
        </div>

        <div className="lenses">
          <Lens car={A} />
          <Lens car={B} ev />
        </div>

        <div className="priobar">
          <span className="lbl">What matters most to you?</span>
          <div className="seg">
            {[['price','Upfront price'],['running','Running cost'],['total','5-year total']].map(([k,l]) => (
              <button key={k} className={prio===k?'on':''} onClick={()=>setPrio(k)}>{l}</button>
            ))}
          </div>
        </div>

        <div className="cmp">
          {rows.map((r) => {
            const aWin = r.aw === true, bWin = r.aw === false;
            const dim = r.metric && r.metric !== prio;
            return (
              <div className="cmp-row" key={r.k}>
                <div className={'cmp-cell right' + (aWin ? ' win' : '')} style={dim?{opacity:.62}:null}>
                  {r.a}{r.as && <span className="sub">{r.as}</span>}
                </div>
                <div className="mid">{r.k}</div>
                <div className={'cmp-cell' + (bWin ? ' win' : '')} style={dim?{opacity:.62}:null}>
                  {r.b}{r.bs && <span className="sub">{r.bs}</span>}
                </div>
              </div>
            );
          })}
        </div>

        <div className="verdict">
          <div className="ic"><Trophy/></div>
          <div className="tx">
            <div className="k">Verdict · by {prio === 'price' ? 'upfront price' : prio === 'running' ? 'running cost' : '5-year total'}</div>
            <div className="v">The <b>{w.who}</b> wins — {w.d} {w.txt}.</div>
          </div>
          <a className="btn btn-accent" href="calculator.html">Model it fully <span className="arr">→</span></a>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
