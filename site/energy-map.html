  .filters button.on{background:var(--accent);border-color:transparent;color:var(--accent-ink);}

  .stn{padding:14px 14px;border-radius:14px;cursor:pointer;transition:background .2s;border:1px solid transparent;}
  .stn:hover{background:var(--bg-2);}
  .stn.sel{background:var(--bg-2);border-color:color-mix(in srgb,var(--accent) 34%,transparent);}
  .stn .r1{display:flex;align-items:center;gap:9px;}
  .stn .sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .stn .sdot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .stn .sdot.busy{background:var(--warn);}
  .stn h4{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;flex:1;letter-spacing:-0.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stn .dist{font-size:12px;color:var(--fg-3);white-space:nowrap;flex:0 0 auto;}
  .stn .r2{display:flex;align-items:center;gap:8px;margin-top:9px;padding-left:17px;flex-wrap:wrap;}
  .stn .pw{font-family:'Space Grotesk',sans-serif;font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap;}
  .stn .conn{font-size:11px;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--line-2);padding:2px 8px;border-radius:6px;}

  .mapcanvas{position:relative;background:var(--bg-2);border:1px solid var(--line-2);border-radius:20px;overflow:hidden;}
  .legend{position:absolute;top:16px;left:16px;display:flex;gap:14px;font-size:11.5px;color:var(--fg-2);

    background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px);text-align:center;}

  .mapkey-overlay h3{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;margin-bottom:8px;}

  .maploading{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:5;font-size:12px;color:var(--fg-2);

  .src-badge{font-size:11px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
    padding:2px 9px;border-radius:999px;white-space:nowrap;}

  @media (max-width:980px){
    .map-shell{grid-template-columns:1fr;height:auto;}
    .sidebar{height:auto;max-height:420px;}
    .mapcanvas{height:440px;}
  }

<!-- Google Maps browser key + API base (git-ignored). Copy config.example.js -> config.local.js. -->
<script src="config.local.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Injected by config.local.js (git-ignored). Empty until you add your key.
const MAPS_KEY = window.GOOGLE_MAPS_API_KEY || '';
const API_BASE = window.API_BASE || '';
const SA_CENTER = { lat: -26.1076, lng: 28.0567 }; // Sandton, Johannesburg

// On-brand dark map style (no Map ID needed with classic styling).
const DARK_STYLE = [
  { elementType:'geometry', stylers:[{ color:'#0e1014' }] },
  { elementType:'labels.text.stroke', stylers:[{ color:'#0e1014' }] },
  { elementType:'labels.text.fill', stylers:[{ color:'#9aa0aa' }] },
  { featureType:'poi', stylers:[{ visibility:'off' }] },
  { featureType:'transit', stylers:[{ visibility:'off' }] },
  { featureType:'landscape', elementType:'geometry', stylers:[{ color:'#101318' }] },
  { featureType:'road', elementType:'geometry', stylers:[{ color:'#1a1e26' }] },
  { featureType:'road', elementType:'labels.text.fill', stylers:[{ color:'#6e727c' }] },
  { featureType:'road.highway', elementType:'geometry', stylers:[{ color:'#2a2f3a' }] },
  { featureType:'administrative', elementType:'geometry', stylers:[{ color:'#2a2f3a' }] },
  { featureType:'water', elementType:'geometry', stylers:[{ color:'#0a0b0d' }] },
];

function statusColor(st){ return st==='ok' ? '#5BD0A0' : st==='busy' ? '#E8A04E' : '#6E98FF'; }

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// Teardrop pin (data-URI SVG) coloured by live status, kW inside.
function pinSvg(kw, color){
  const label = kw ? String(Math.round(kw)) : '';
  const svg =
    "<svg xmlns='http://www.w3.org/2000/svg' width='40' height='48' viewBox='0 0 40 48'>" +
    "<path d='M20 46C20 46 35 27 35 15A15 15 0 1 0 5 15C5 27 20 46 20 46Z' fill='" + color + "' stroke='#0A0B0D' stroke-width='2'/>" +
    "<text x='20' y='19' text-anchor='middle' font-family='Space Grotesk, sans-serif' font-size='11' font-weight='700' fill='#0A0B0D'>" + label + "</text>" +
    "</svg>";
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}

// InfoWindow renders in Google's (light) bubble, so use dark text here.
function infoHtml(s){
  const conn = (s.conn && s.conn.length) ? s.conn.join(' / ') : '—';
  const kw = s.kw ? (s.kw + ' kW') : 'Power n/a';
  const stat = s.status==='ok' ? 'Available' : s.status==='busy' ? 'Busy' : 'Status unknown';
  return "<div style=\"font-family:Inter,sans-serif;min-width:180px;color:#14171D\">" +
    "<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px\">" + escapeHtml(s.name) + "</div>" +
    "<div style=\"color:#5A5E66;font-size:12px;margin-top:2px\">" + escapeHtml(s.area||'') + (s.dist!=null ? (' · ' + s.dist + ' km') : '') + "</div>" +
    "<div style=\"font-weight:700;color:#2F5BD6;margin-top:6px\">" + kw + "</div>" +
    "<div style=\"font-size:12px;margin-top:2px;color:#5A5E66\">" + escapeHtml(conn) + " · " + stat + "</div>" +
    "</div>";
}

// Load the Maps JS API once; resolve with google.maps.
function loadGoogleMaps(key){
  return new Promise(function(resolve, reject){
    if (window.google && window.google.maps) return resolve(window.google.maps);
    window.__initGMap = function(){ resolve(window.google.maps); };
    const s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&callback=__initGMap&loading=async';
    s.async = true;
    s.onerror = function(){ reject(new Error('Failed to load Google Maps JS API')); };
    document.head.appendChild(s);
  });
}

// Browser-side fallback used only if /api is unreachable (e.g. opened via file://).
function localSample(){
  const seed = [
    ['Sandton City','Sandton', 0.001,-0.004,150,['CCS','Type 2'],'ok'],
    ['Mall of Africa','Midrand', 0.060, 0.010, 60,['CCS'],'busy'],
    ['Rosebank Mall','Rosebank',-0.030,-0.010, 80,['CCS','Type 2'],'ok'],
    ['Melrose Arch','Melrose', -0.020, 0.005, 22,['Type 2'],'ok'],
    ['N1 Engen 1-Stop','N1 North', 0.090,-0.050,200,['CCS'],'ok'],
    ['Fourways Mall','Fourways', 0.080,-0.020,120,['CCS','Type 2'],'busy'],
  ];
  return seed.map(function(r,i){
    return { id:'local-'+(i+1), name:r[0], area:r[1], lat:SA_CENTER.lat+r[2], lng:SA_CENTER.lng+r[3],
             kw:r[4], conn:r[5], price:null, rating:null, status:r[6], dist:null };
  });
}

function App(){
  const [stations, setStations] = useState([]);
  const [sel, setSel] = useState(null);
  const [filter, setFilter] = useState('all');
  const [phase, setPhase] = useState('loading'); // loading | ready
  const [source, setSource] = useState(null);
  const keyMissing = !MAPS_KEY;

  // Where the map and the charger search are currently centred. Driven by the
  // search box; every charger fetch keys off it.
  const [center, setCenter] = useState(SA_CENTER);
  const [place, setPlace] = useState('Sandton, Johannesburg');
  const [q, setQ] = useState('Sandton, Johannesburg');
  const [searching, setSearching] = useState(false);
  const [searchMsg, setSearchMsg] = useState(null);

  const mapElRef = useRef(null);
  const mapRef = useRef(null);
  const markersRef = useRef({});
  const infoRef = useRef(null);

  // 1) Fetch chargers around the current centre (server falls back to sample
  //    without a key). Re-runs whenever a search moves the centre.
  useEffect(function(){
    let alive = true;
    setPhase('loading');
    fetch(API_BASE + '/api/chargers?lat=' + center.lat + '&lng=' + center.lng)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!alive) return;
        const list = (d && d.stations) || [];
        setStations(list);
        setSource((d && d.source) || null);
        setSel(list[0] ? list[0].id : null);
        setPhase('ready');
      })
      .catch(function(){
        if (!alive) return;
        const list = localSample();
        setStations(list); setSource('local'); setSel(list[0].id); setPhase('ready');
      });
    return function(){ alive = false; };
  }, [center]);

  // Resolve what the user typed to coordinates. Geocoding runs server-side so
  // this works even with no browser Maps key — the list moves regardless of
  // whether the map canvas can render.
  const runSearch = function(e){
    if (e) e.preventDefault();
    const term = q.trim();
    if (!term) { setSearchMsg({ err: true, text: 'Type a suburb, city or address to search.' }); return; }
    setSearching(true); setSearchMsg(null);
    fetch(API_BASE + '/api/geocode?q=' + encodeURIComponent(term))
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if (!res.ok || res.d.lat == null) {
          setSearchMsg({ err: true, text: (res.d && res.d.message) || 'Could not find that place.' });
          return;
        }
        setCenter({ lat: res.d.lat, lng: res.d.lng });
        setPlace(res.d.label);
        setSearchMsg({ err: false, text: res.d.label });
      })
      .catch(function(){
        setSearchMsg({ err: true, text: 'Location lookup is unavailable — is the backend running?' });
      })
      .then(function(){ setSearching(false); });
  };

  // 2) Init the map once (only if a browser key is present).
  useEffect(function(){
    if (!MAPS_KEY || !mapElRef.current) return;
    let cancelled = false;
    loadGoogleMaps(MAPS_KEY).then(function(maps){
      if (cancelled) return;
      const dark = document.documentElement.dataset.theme !== 'light';
      mapRef.current = new maps.Map(mapElRef.current, {
        center: SA_CENTER, zoom: 11, disableDefaultUI: true, zoomControl: true,
        styles: dark ? DARK_STYLE : [],
      });
      infoRef.current = new maps.InfoWindow();
      // Re-style live when the theme toggle flips data-theme.
      const obs = new MutationObserver(function(){
        if (!mapRef.current) return;
        const d = document.documentElement.dataset.theme !== 'light';
        mapRef.current.setOptions({ styles: d ? DARK_STYLE : [] });
      });
      obs.observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
    }).catch(function(){ /* overlay stays up */ });
    return function(){ cancelled = true; };
  }, []);

  // 2b) Follow the search: recentre the map when the centre moves. Guarded on
  //     the default so it doesn't fight the map's own initial center option.
  useEffect(function(){
    if (!mapRef.current) return;
    if (center.lat === SA_CENTER.lat && center.lng === SA_CENTER.lng) return;
    mapRef.current.panTo({ lat: center.lat, lng: center.lng });
    mapRef.current.setZoom(12);
  }, [center]);

  // 3) Rebuild markers whenever the station list changes.
  useEffect(function(){
    const maps = window.google && window.google.maps;
    if (!maps || !mapRef.current) return;
    Object.keys(markersRef.current).forEach(function(id){ markersRef.current[id].setMap(null); });
    markersRef.current = {};
    stations.forEach(function(s){
      if (s.lat == null || s.lng == null) return;
      const marker = new maps.Marker({
        position: { lat: s.lat, lng: s.lng }, map: mapRef.current, title: s.name,
        icon: { url: pinSvg(s.kw, statusColor(s.status)),
                scaledSize: new maps.Size(40,48), anchor: new maps.Point(20,46) },
      });
      marker.addListener('click', function(){ setSel(s.id); });
      markersRef.current[s.id] = marker;
    });
  }, [stations, phase]);

  // 4) On selection: pan + open info window.
  useEffect(function(){
    const maps = window.google && window.google.maps;
    const s = stations.find(function(x){ return x.id === sel; });
    if (!maps || !mapRef.current || !s || s.lat == null) return;
    mapRef.current.panTo({ lat: s.lat, lng: s.lng });
    const marker = markersRef.current[s.id];
    if (infoRef.current && marker){
      infoRef.current.setContent(infoHtml(s));
      infoRef.current.open(mapRef.current, marker);
    }
  }, [sel, stations]);

  const list = stations.filter(function(s){
    return filter==='all' ? true : filter==='fast' ? (s.kw||0) >= 100 : s.status==='ok';
  });
  const okCount = stations.filter(function(s){ return s.status==='ok'; }).length;
  // "unavailable" means we have no charger data at all, not zero chargers
  // nearby. Those are different claims and the page must not merge them.
  const unavailable = source === 'unavailable';

  return (
    <div className="map-page">
      <div className="map-head">
        <div>
          <div className="eyebrow">Energy Map {!unavailable && <span className="pp">Live</span>}</div>
          <h1>Charge with confidence.</h1>
          <p>Every public charger near you and along your routes — power, price and live availability.</p>
        </div>
        <div className="chips" style={{display:'flex',gap:'10px',alignItems:'center'}}>
          {!unavailable && (
            <span style={{fontFamily:"'Space Grotesk'",fontSize:'15px',color:'var(--fg-2)'}}>
              <b style={{color:'var(--fg)'}}>{okCount}</b> available now · <b style={{color:'var(--fg)'}}>{stations.length}</b> near{' '}
              <b style={{color:'var(--fg)'}}>{String(place).split(',')[0]}</b>
            </span>
          )}
        </div>
      </div>

      <div className="map-shell">
        <div className="sidebar">
          <div className="searchbar">
            <form onSubmit={runSearch}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
              <input placeholder="Search area or address…" value={q} aria-label="Search area or address"
                onChange={function(e){ setQ(e.target.value); }} />
              <button type="submit" disabled={searching}>{searching ? 'Searching…' : 'Search'}</button>
            </form>
            {searchMsg
              ? <div className={'searchmsg' + (searchMsg.err ? ' err' : '')}>
                  {searchMsg.err ? searchMsg.text : <span>Showing chargers near <b>{searchMsg.text}</b></span>}
                </div>
              : <div className="searchmsg">Press Enter or hit Search to move the map.</div>}
            {unavailable && (
              <div className="searchmsg err">
                Charger data isn't available right now, so the map is empty. We'd
                rather show you nothing than invent stations you might drive to.
              </div>
            )}
          </div>
          <div className="filters">
            {[['all','All chargers'],['fast','Fast DC'],['ok','Available now']].map(([k,l]) => (
              <button key={k} className={filter===k?'on':''} onClick={()=>setFilter(k)}>{l}</button>
            ))}
          </div>
          <div className="stationlist">
            {phase==='loading' && <div style={{padding:'18px',color:'var(--fg-3)',fontSize:'13px'}}>Loading chargers…</div>}
            {phase==='ready' && list.length===0 && (
              <div style={{padding:'18px',color:'var(--fg-3)',fontSize:'13px'}}>
                {unavailable
                  ? "No charger data to show."
                  : stations.length === 0
                    ? 'No chargers found near ' + String(place).split(',')[0] + '.'
                    : 'No chargers match this filter.'}
              </div>
            )}
            {list.map((s) => (
              <div key={s.id} className={'stn' + (sel===s.id?' sel':'')} onClick={()=>setSel(s.id)}>
                <div className="r1">
                  <span className={'sdot '+(s.status==='ok'?'ok':'busy')}/>
                  <h4>{s.name}</h4>
                  {s.dist!=null && <span className="dist">{s.dist} km</span>}
                </div>
                <div className="r2">
                  {s.kw ? <span className="pw">{s.kw} kW</span> : null}
                  {(s.conn||[]).map((c)=><span className="conn" key={c}>{c}</span>)}
                  {s.price ? <span className="price">{s.price}/kWh</span> : null}
                </div>
                <div className={'status '+(s.status==='ok'?'ok':'busy')}>
                  {s.status==='ok' ? '✓ Available' : s.status==='busy' ? '⚠ Busy' : 'Status unknown'}
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="mapcanvas">
          <div id="gmap" className="gmap" ref={mapElRef}></div>

          {phase==='loading' && <div className="maploading">Loading chargers…</div>}

          {keyMissing && (
            <div className="mapkey-overlay">
              <div className="card">
                <h3>Add your Google Maps key</h3>
                <p>Copy <code>site/config.example.js</code> → <code>config.local.js</code> and paste your
                referrer-restricted <b>Maps JavaScript API</b> key. The charger list still loads
                from the backend meanwhile.</p>
              </div>
            </div>
          )}

          <div className="legend">
            <span><i style={{background:'var(--ok)'}}/>Available</span>
            <span><i style={{background:'var(--warn)'}}/>Busy</span>
          </div>
          <a className="btn btn-ghost btn-sm routebtn" href="#" onClick={(e)=>e.preventDefault()}>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H14a4 4 0 0 0 0-8H10a4 4 0 0 1 0-8h5.5"/></svg>
            Plan a route
          </a>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
