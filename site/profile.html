<style>
  .mobile-menu{position:fixed;inset:72px 0 auto 0;z-index:55;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);padding:14px 22px 24px;display:none;}
  .mobile-menu.open{display:block;}
  .mobile-menu a{display:block;padding:13px 0;font-size:16px;color:var(--fg-2);border-bottom:1px solid var(--line-2);}

  .prof{max-width:1080px;margin:0 auto;padding:112px 24px 90px;}
  .center-note{max-width:560px;margin:180px auto;text-align:center;color:var(--fg-2);}
  .center-note h2{font-family:'Space Grotesk',sans-serif;font-size:24px;color:var(--fg);margin-bottom:10px;}
  .center-note a{color:var(--accent);}

  .phead{display:flex;align-items:center;gap:24px;padding-bottom:32px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;}
  .phead .bigav{width:96px;height:96px;border-radius:24px;background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#7a5cff));
    color:var(--accent-ink);display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;position:relative;flex:0 0 auto;box-shadow:0 16px 40px -16px var(--glow);}
  .phead .bigav img{width:100%;height:100%;object-fit:cover;}
  .phead .bigav .cam{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--fg-2);cursor:pointer;}
  .phead .bigav .cam svg{width:14px;height:14px;}
  .phead .who{flex:1;min-width:200px;}
  .phead .who h1{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .verif{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);border-radius:999px;padding:3px 9px;letter-spacing:.02em;}
  .verif svg{width:12px;height:12px;}
  .phead .who .handle{font-size:14px;color:var(--fg-3);margin-top:4px;}
  .phead .who .car{display:flex;align-items:center;gap:10px;color:var(--fg-2);font-size:14.5px;margin-top:10px;flex-wrap:wrap;}
  .phead .who .car .b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--fg-3);}
  .phead .who .since{font-size:13px;color:var(--fg-3);margin-top:7px;}
  .phead .actions{display:flex;gap:10px;flex-wrap:wrap;}

  .countrow{display:flex;gap:30px;margin:26px 0 4px;}
  .countrow .c{cursor:default;}
  .countrow .c .v{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
  .countrow .c .l{font-size:12.5px;color:var(--fg-3);margin-top:2px;}

  .badges{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 8px;}
  .badge-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);font-size:13px;color:var(--fg-2);}
  .badge-chip .ic{font-size:15px;line-height:1;}

  .pgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:26px;}
  .pcard{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:26px;}
  .pcard + .pcard{margin-top:18px;}
  .pcard .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .pcard .ch h3{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;letter-spacing:-0.01em;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--fg-3);margin-bottom:7px;}
  .field .inp{display:flex;align-items:center;height:48px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
    background:var(--bg-2);transition:border-color .2s,box-shadow .2s,opacity .2s;}
  .field .inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);}
  .field .inp.ro{opacity:.62;}
  .field .inp .pre{color:var(--fg-3);font-size:14px;margin-right:6px;}
  .field .inp .suf{color:var(--fg-3);font-size:13px;margin-left:6px;white-space:nowrap;}
  .field .inp input,.field .inp select,.field .inp textarea{flex:1;min-width:0;background:transparent;border:none;outline:none;
    color:var(--fg);font:inherit;font-size:14.5px;}
  .field textarea{resize:none;height:70px;padding:12px 14px;}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;}
  .toggle-row .k{font-size:14px;color:var(--fg);}
  .toggle-row .sub{font-size:12.5px;color:var(--fg-3);margin-top:2px;max-width:280px;}
  .sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto;}
  .sw.on{background:var(--accent);}
  .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:left .2s;}
  .sw.on i{left:21px;}
  .acct-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-top:1px solid var(--line-2);gap:12px;}
  .acct-row:first-of-type{border-top:0;padding-top:0;}
  .acct-row .k{font-size:14px;color:var(--fg);}
  .acct-row .sub{font-size:12.5px;color:var(--fg-3);margin-top:2px;}
  .acct-row button{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);
    color:var(--fg);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .2s;}
  .acct-row button:hover{border-color:var(--fg-3);}
  .acct-row button.danger{color:#ff7a7a;border-color:color-mix(in srgb,#ff7a7a 30%,transparent);}
  .theme-inline{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--bg-2);}
  .theme-inline button{appearance:none;border:none;background:transparent;cursor:pointer;width:30px;height:26px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;color:var(--fg-3);transition:all .2s;padding:0;}
  .theme-inline button.on{background:var(--fg);color:var(--bg);}
  .theme-inline svg{width:13px;height:13px;}

  .mini{display:flex;flex-direction:column;gap:12px;}
  .mini-post{border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;background:var(--bg-2);}
  .mini-post .t{font-size:11.5px;color:var(--fg-3);margin-bottom:6px;}
  .mini-post .bd{font-size:14px;color:var(--fg-2);line-height:1.5;}
  .mini-post .m{font-size:12px;color:var(--fg-3);margin-top:8px;display:flex;gap:14px;}
  .cmp-mini{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line-2);border-radius:14px;
    padding:14px 16px;background:var(--bg-2);gap:12px;}
  .cmp-mini .nm{font-size:14px;color:var(--fg);font-weight:500;}
  .cmp-mini .sub{font-size:12px;color:var(--fg-3);margin-top:3px;}
  .cmp-mini .win{font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap;}
  .empty{font-size:13.5px;color:var(--fg-3);text-align:center;padding:22px 0;}
  .empty a{color:var(--accent);}
  .save-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--shadow);border-radius:999px;padding:11px 20px;font-size:13.5px;color:var(--fg);z-index:70;display:flex;align-items:center;gap:9px;}
  .save-toast .d{width:7px;height:7px;border-radius:50%;background:var(--ok);}

  @media (max-width:860px){ .pgrid{grid-template-columns:1fr;} }
  @media (max-width:560px){
    .prof{padding-top:96px;}
    .phead .bigav{width:76px;height:76px;font-size:28px;border-radius:20px;}
    .phead .who h1{font-size:25px;}
    .countrow{gap:22px;}
    .frow{grid-template-columns:1fr;}
  }
</style>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const DB = window.DB;
const group = DB ? DB.group : (n)=>String(n);
const FUELS = ['ICE','EV','Hybrid','PHEV'];

const Cam = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M5 8h3l1.5-2h5L16 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>;
const Sun = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>;
const Moon = () => <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>;
const Verified = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l2.4 2.1 3.2-.3.9 3.1 2.6 1.9-1.3 2.9 1.3 2.9-2.6 1.9-.9 3.1-3.2-.3L12 22l-2.4-2.1-3.2.3-.9-3.1L2.9 15l1.3-2.9L2.9 9.2l2.6-1.9.9-3.1 3.2.3z"/><path d="M9 12l2 2 4-4"/></svg>;
const Car = () => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"><path d="M3 13l2-5a2 2 0 0 1 1.9-1.3h10.2A2 2 0 0 1 19 8l2 5v5h-3v-2H6v2H3v-5z"/><circle cx="7.5" cy="15.5" r="1.5"/><circle cx="16.5" cy="15.5" r="1.5"/></svg>;

function Field({ label, value, onChange, ro, pre, suf, textarea, select, options, type, placeholder }) {
  return (
    <div className="field">
      <label>{label}</label>
      <div className={'inp' + (ro ? ' ro' : '')}>
        {pre && <span className="pre">{pre}</span>}
        {textarea
          ? <textarea value={value||''} disabled={ro} placeholder={placeholder} onChange={(e)=>onChange&&onChange(e.target.value)} />
          : select
            ? <select value={value||''} disabled={ro} onChange={(e)=>onChange&&onChange(e.target.value)}>{options.map(o=><option key={o} value={o}>{o}</option>)}</select>
            : <input type={type||'text'} value={value==null?'':value} disabled={ro} placeholder={placeholder} onChange={(e)=>onChange&&onChange(e.target.value)} />}
        {suf && <span className="suf">{suf}</span>}
      </div>
    </div>
  );
}

function memberSince(ts) {
  try { return new Date(ts).toLocaleDateString('en-ZA', { month: 'long', year: 'numeric' }); }
  catch (e) { return '—'; }
}

function App() {
  const [state, setState] = useState('loading'); // loading | ready | notconfig | signin | error
  const [errMsg, setErrMsg] = useState('');
  const [isMe, setIsMe] = useState(false);
  const [p, setP] = useState(null);          // profile row (edited copy)
  const [orig, setOrig] = useState(null);    // last-saved copy
  const [counts, setCounts] = useState({ followers: 0, following: 0, posts: 0 });
  const [badges, setBadges] = useState([]);
  const [posts, setPosts] = useState([]);
  const [comparisons, setComparisons] = useState([]);
  const [edit, setEdit] = useState(false);
  const [following, setFollowing] = useState(false);
  const [busyFollow, setBusyFollow] = useState(false);
  const [email, setEmail] = useState('');
  const [theme, setTheme] = useState(document.documentElement.getAttribute('data-theme') || 'dark');
  const [toast, setToast] = useState('');
  const fileRef = useRef(null);

  useEffect(() => {
    (async () => {
      if (!DB || !DB.configured) { setState('notconfig'); return; }
      try {
        const handleParam = new URLSearchParams(location.search).get('u');
        const me = await DB.getUser();
        let profile, mine;
        if (handleParam) {
          profile = await DB.getProfile(handleParam);
          mine = !!(me && me.id === profile.id);
        } else {
          if (!me) { const next = encodeURIComponent('profile.html'); location.href = 'auth.html?next=' + next; return; }
          profile = await DB.profile();
          mine = true;
        }
        setIsMe(mine);
        setP(profile); setOrig(profile);
        if (me) setEmail(me.email || '');

        // counts
        const [followers, followingC, postsC] = await Promise.all([
          DB.sb.from('follows').select('*', { count: 'exact', head: true }).eq('following_id', profile.id),
          DB.sb.from('follows').select('*', { count: 'exact', head: true }).eq('follower_id', profile.id),
          DB.sb.from('posts').select('*', { count: 'exact', head: true }).eq('author_id', profile.id),
        ]);
        setCounts({ followers: followers.count || 0, following: followingC.count || 0, posts: postsC.count || 0 });

        // badges
        const b = await DB.sb.from('profile_badges').select('badge_slug, badges(label, description, icon)').eq('profile_id', profile.id);
        setBadges((b.data || []).map(r => r.badges).filter(Boolean));

        // recent posts
        const rp = await DB.sb.from('posts').select('id, body, created_at, like_count, comment_count').eq('author_id', profile.id).order('created_at', { ascending: false }).limit(4);
        setPosts(rp.data || []);

        // saved comparisons (own: all, others: public only via RLS)
        const rc = await DB.sb.from('comparisons').select('id, title, result, is_public, created_at').eq('owner_id', profile.id).order('created_at', { ascending: false }).limit(5);
        setComparisons(rc.data || []);

        // follow state
        if (me && !mine) {
          const f = await DB.sb.from('follows').select('follower_id', { head: true, count: 'exact' }).eq('follower_id', me.id).eq('following_id', profile.id);
          setFollowing((f.count || 0) > 0);
        }
        setState('ready');
      } catch (ex) {
        // A paused/deleted project fails at the transport layer, which would
        // otherwise render as a bare "TypeError: Failed to fetch".
        setErrMsg((ex && ex.message) || String(ex));
        setState(DB.isNetworkError(ex) ? 'unreachable' : 'error');
      }
    })();
  }, []);

  const up = (k) => (v) => setP({ ...p, [k]: v });

  const save = async () => {
    try {
      const patch = {
        display_name: (p.display_name || '').trim() || 'New member',
        bio: p.bio || '',
        car_make: p.car_make || null,
        car_model: p.car_model || null,
        car_year: p.car_year ? parseInt(p.car_year, 10) : null,
        fuel_type: p.fuel_type || null,
        location: p.location || null,
        monthly_km: p.monthly_km ? parseInt(p.monthly_km, 10) : null,
        home_tariff: p.home_tariff ? parseFloat(p.home_tariff) : null,
        is_verified_owner: !!p.is_verified_owner,
      };
      const { data, error } = await DB.sb.from('profiles').update(patch).eq('id', p.id).select().single();
      if (error) throw error;
      DB.clearProfileCache();
      setP(data); setOrig(data); setEdit(false);
      flash('Profile saved');
    } catch (ex) { flash('Could not save: ' + ((ex && ex.message) || ex)); }
  };

  const cancel = () => { setP(orig); setEdit(false); };

  const pickAvatar = () => fileRef.current && fileRef.current.click();
  const onAvatar = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      flash('Uploading…');
      const path = await DB.upload('avatars', file, p.id);
      const { data, error } = await DB.sb.from('profiles').update({ avatar_url: path }).eq('id', p.id).select().single();
      if (error) throw error;
      DB.clearProfileCache();
      setP(data); setOrig({ ...orig, avatar_url: path });
      flash('Photo updated');
    } catch (ex) { flash('Upload failed: ' + ((ex && ex.message) || ex)); }
  };

  const toggleFollow = async () => {
    const me = DB.user();
    if (!me) { location.href = 'auth.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
    setBusyFollow(true);
    try {
      if (following) {
        await DB.sb.from('follows').delete().eq('follower_id', me.id).eq('following_id', p.id);
        setFollowing(false); setCounts(c => ({ ...c, followers: Math.max(0, c.followers - 1) }));
      } else {
        await DB.sb.from('follows').insert({ follower_id: me.id, following_id: p.id });
        setFollowing(true); setCounts(c => ({ ...c, followers: c.followers + 1 }));
      }
    } catch (ex) { flash('Could not update follow'); }
    finally { setBusyFollow(false); }
  };

  const setTh = (t) => { setTheme(t); window.VOLT && window.VOLT.setTheme(t); };
  const flash = (m) => { setToast(m); clearTimeout(flash._t); flash._t = setTimeout(() => setToast(''), 2200); };

  if (state === 'loading') return <div className="prof"><div className="center-note">Loading…</div></div>;
  if (state === 'notconfig') return (
    <div className="prof"><div className="center-note">
      <h2>Backend not connected</h2>
      <p>Add your Supabase keys to <b>config.local.js</b> to enable profiles. See <b>supabase/README.md</b>.</p>
    </div></div>
  );
  if (state === 'unreachable') return (
    <div className="prof"><div className="center-note">
      <h2>Can’t reach the backend</h2>
      <p>Your Supabase project didn’t respond — it looks paused or offline. Resume it in the
         dashboard, or point <b>site/config.local.js</b> at a new one.</p>
      <p><a href="garage.html">← Back to The Garage</a></p>
    </div></div>
  );
  if (state === 'error') return (
    <div className="prof"><div className="center-note"><h2>Couldn’t load this profile</h2><p>{errMsg}</p><p><a href="garage.html">← Back to The Garage</a></p></div></div>
  );

  const av = DB.avatarUrl(p);
  const carLine = [p.car_year, p.car_make, p.car_model].filter(Boolean).join(' ');
  const editable = isMe && edit;

  return (
    <div className="prof">
      <div className="phead">
        <div className="bigav">
          {av ? <img src={av} alt=""/> : DB.initials(p.display_name)}
          {isMe && <span className="cam" onClick={pickAvatar} title="Change photo"><Cam/></span>}
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={onAvatar} />
        </div>
        <div className="who">
          <h1>{p.display_name}
            {p.is_verified_owner && <span className="verif"><Verified/> Verified owner</span>}
          </h1>
          <div className="handle">@{p.handle}</div>
          {carLine && <div className="car"><Car/>{carLine}{p.fuel_type && <span className="b">{p.fuel_type}</span>}</div>}
          {p.bio && !editable && <div className="since" style={{marginTop:'10px',color:'var(--fg-2)',fontSize:'14.5px',maxWidth:'52ch'}}>{p.bio}</div>}
          <div className="since">Member since {memberSince(p.created_at)}{p.location ? ' · ' + p.location : ''}</div>
        </div>
        <div className="actions">
          {isMe
            ? (edit
                ? <><button className="btn btn-ghost btn-sm" onClick={cancel}>Cancel</button><button className="btn btn-accent btn-sm" onClick={save}>Save</button></>
                : <button className="btn btn-ghost btn-sm" onClick={()=>setEdit(true)}>Edit profile</button>)
            : <button className="btn btn-sm" onClick={toggleFollow} disabled={busyFollow}
                style={following ? {background:'transparent',color:'var(--fg)',border:'1px solid var(--line)'} : {background:'var(--accent)',color:'var(--accent-ink)'}}>
                {following ? 'Following' : 'Follow'}
              </button>}
        </div>
      </div>

      <div className="countrow">
        <div className="c"><div className="v mono-num">{group(counts.posts)}</div><div className="l">Posts</div></div>
        <div className="c"><div className="v mono-num">{group(counts.followers)}</div><div className="l">Followers</div></div>
        <div className="c"><div className="v mono-num">{group(counts.following)}</div><div className="l">Following</div></div>
      </div>

      {badges.length > 0 && (
        <div className="badges">
          {badges.map(b => <span className="badge-chip" key={b.label} title={b.description}><span className="ic">{b.icon || '●'}</span>{b.label}</span>)}
        </div>
      )}

      <div className="pgrid">
        <div>
          <div className="pcard">
            <div className="ch"><h3>{isMe ? 'Profile details' : 'About'}</h3>
              {isMe && !edit && <button className="btn btn-ghost btn-sm" style={{height:'36px'}} onClick={()=>setEdit(true)}>Edit</button>}
            </div>
            <Field label="Display name" value={p.display_name} onChange={up('display_name')} ro={!editable} />
            <Field label="Bio" value={p.bio} onChange={up('bio')} ro={!editable} textarea placeholder="Tell the community about your ride and your switch." />
            <div className="frow">
              <Field label="Car make" value={p.car_make} onChange={up('car_make')} ro={!editable} placeholder="e.g. BYD" />
              <Field label="Car model" value={p.car_model} onChange={up('car_model')} ro={!editable} placeholder="e.g. Dolphin" />
            </div>
            <div className="frow">
              <Field label="Year" value={p.car_year} onChange={up('car_year')} ro={!editable} type="number" placeholder="2024" />
              <Field label="Drivetrain" value={p.fuel_type} onChange={up('fuel_type')} ro={!editable} select options={['', ...FUELS]} />
            </div>
            <Field label="Location" value={p.location} onChange={up('location')} ro={!editable} placeholder="e.g. Cape Town" />
          </div>

          <div className="pcard">
            <div className="ch"><h3>Recent posts</h3><a href="garage.html" style={{fontSize:'13px',color:'var(--accent)'}}>Open feed →</a></div>
            {posts.length === 0
              ? <div className="empty">{isMe ? <>No posts yet — <a href="garage.html">share your first</a> in The Garage.</> : 'No posts yet.'}</div>
              : <div className="mini">{posts.map(po => (
                  <div className="mini-post" key={po.id}>
                    <div className="t">{DB.timeAgo(po.created_at)}</div>
                    <div className="bd">{po.body || '(photo post)'}</div>
                    <div className="m"><span>♥ {po.like_count}</span><span>💬 {po.comment_count}</span></div>
                  </div>
                ))}</div>}
          </div>
        </div>

        <div>
          {isMe && (
            <div className="pcard">
              <div className="ch"><h3>Switch preferences</h3></div>
              <Field label="Typical monthly distance" value={p.monthly_km} onChange={up('monthly_km')} ro={!editable} suf="km" type="number" />
              <Field label="Home electricity tariff" value={p.home_tariff} onChange={up('home_tariff')} ro={!editable} pre="R" suf="/kWh" type="number" />
              <div className="toggle-row" style={{borderTop:'1px solid var(--line-2)'}}>
                <div><div className="k">EV owner</div><div className="sub">Unlocks the “Verified owner” badge so buyers can find you in Ask an Owner.</div></div>
                <div className={'sw' + (p.is_verified_owner ? ' on' : '')} onClick={()=>editable && up('is_verified_owner')(!p.is_verified_owner)}
                     style={{opacity: editable ? 1 : .5, pointerEvents: editable ? 'auto' : 'none'}}><i/></div>
              </div>
              <div className="toggle-row" style={{borderTop:'1px solid var(--line-2)'}}>
                <div><div className="k">Appearance</div><div className="sub">Used across the app.</div></div>
                <div className="theme-inline">
                  <button className={theme==='light'?'on':''} onClick={()=>setTh('light')}><Sun/></button>
                  <button className={theme==='dark'?'on':''} onClick={()=>setTh('dark')}><Moon/></button>
                </div>
              </div>
            </div>
          )}

          <div className="pcard">
            <div className="ch"><h3>Saved comparisons</h3><a href="snap-compare.html" style={{fontSize:'13px',color:'var(--accent)'}}>Compare →</a></div>
            {comparisons.length === 0
              ? <div className="empty">{isMe ? <>Nothing saved yet — build one in <a href="calculator.html">the calculator</a> or <a href="snap-compare.html">Snap &amp; Compare</a>.</> : 'No public comparisons.'}</div>
              : <div className="mini">{comparisons.map(c => (
                  <div className="cmp-mini" key={c.id}>
                    <div><div className="nm">{c.title}</div><div className="sub">{DB.timeAgo(c.created_at)}{c.is_public ? ' · shared' : ''}</div></div>
                    {c.result && c.result.winner && <div className="win">{c.result.winner} wins</div>}
                  </div>
                ))}</div>}
          </div>

          {isMe && (
            <div className="pcard">
              <div className="ch"><h3>Account</h3></div>
              <div className="acct-row"><div><div className="k">{email || '—'}</div><div className="sub">Sign-in email</div></div></div>
              <div className="acct-row"><div><div className="k">Sign out</div><div className="sub">On this device</div></div>
                <button onClick={()=>DB.signOut().then(()=>location.href='index.html')}>Sign out</button></div>
              <div className="acct-row"><div><div className="k" style={{color:'#ff7a7a'}}>Delete account</div><div className="sub">Contact support to remove your data</div></div>
                <button className="danger" onClick={()=>flash('Email us to delete your account — self-serve deletion is coming soon.')}>Delete</button></div>
            </div>
          )}
        </div>
      </div>

      {toast && <div className="save-toast"><span className="d"/>{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
