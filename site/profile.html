<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ICE → EV · Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="voltage.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  .mobile-menu{position:fixed;inset:72px 0 auto 0;z-index:55;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);padding:14px 22px 24px;display:none;}
  .mobile-menu.open{display:block;}
  .mobile-menu a{display:block;padding:13px 0;font-size:16px;color:var(--fg-2);border-bottom:1px solid var(--line-2);}
  .avatar-chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);cursor:pointer;}
  .avatar-chip .av{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .avatar-chip .nm{font-size:13.5px;color:var(--fg);}

  .prof{max-width:1080px;margin:0 auto;padding:112px 24px 90px;}
  .phead{display:flex;align-items:center;gap:24px;padding-bottom:32px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;}
  .phead .bigav{width:96px;height:96px;border-radius:24px;background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#7a5cff));
    color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;position:relative;flex:0 0 auto;box-shadow:0 16px 40px -16px var(--glow);}
  .phead .bigav .cam{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--fg-2);cursor:pointer;}
  .phead .bigav .cam svg{width:14px;height:14px;}
  .phead .who{flex:1;min-width:200px;}
  .phead .who h1{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;letter-spacing:-0.02em;}
  .phead .who .car{display:flex;align-items:center;gap:10px;color:var(--fg-2);font-size:14.5px;margin-top:8px;}
  .phead .who .car .b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--fg-3);}
  .phead .who .since{font-size:13px;color:var(--fg-3);margin-top:7px;}

  .pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:28px 0;}
  .pstat{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:22px 24px;}
  .pstat .v{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
  .pstat .v .u{color:var(--accent);}
  .pstat .l{font-size:13px;color:var(--fg-2);margin-top:6px;}
  .pstat a{font-size:12.5px;color:var(--accent);margin-top:10px;display:inline-flex;align-items:center;gap:5px;}

  .pgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;}
  .pcard{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:26px;}
  .pcard + .pcard{margin-top:18px;}
  .pcard .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .pcard .ch h3{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;letter-spacing:-0.01em;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--fg-3);margin-bottom:7px;}
  .field .inp{display:flex;align-items:center;height:48px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
    background:var(--bg-2);transition:border-color .2s,box-shadow .2s,opacity .2s;}
  .field .inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);}
  .field .inp.ro{opacity:.62;}
  .field .inp .pre{color:var(--fg-3);font-size:14px;margin-right:6px;}
  .field .inp .suf{color:var(--fg-3);font-size:13px;margin-left:6px;white-space:nowrap;}
  .field .inp input,.field .inp select,.field .inp textarea{flex:1;min-width:0;background:transparent;border:none;outline:none;
    color:var(--fg);font:inherit;font-size:14.5px;}
  .field textarea{resize:none;height:64px;padding:12px 14px;}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .acct-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-top:1px solid var(--line-2);}
  .acct-row:first-of-type{border-top:0;padding-top:0;}
  .acct-row .k{font-size:14px;color:var(--fg);}
  .acct-row .sub{font-size:12.5px;color:var(--fg-3);margin-top:2px;}
  .acct-row button{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);
    color:var(--fg);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .2s;}
  .acct-row button:hover{border-color:var(--fg-3);}
  .acct-row button.danger{color:#ff7a7a;border-color:color-mix(in srgb,#ff7a7a 30%,transparent);}
  .theme-inline{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--bg-2);}
  .theme-inline button{appearance:none;border:none;background:transparent;cursor:pointer;width:30px;height:26px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;color:var(--fg-3);transition:all .2s;padding:0;}
  .theme-inline button.on{background:var(--fg);color:var(--bg);}
  .theme-inline svg{width:13px;height:13px;}
  @media (max-width:860px){ .pgrid,.pstats{grid-template-columns:1fr;} }
  @media (max-width:560px){
    .avatar-chip .nm{display:none;}
    .prof{padding-top:96px;}
    .phead{gap:18px;}
    .phead .bigav{width:76px;height:76px;font-size:28px;border-radius:20px;}
    .phead .who h1{font-size:25px;}
    .phead .btn{width:100%;}
    .pstat .v{font-size:30px;}
    .frow{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<nav class="vnav scrolled">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span>ICE&nbsp;→&nbsp;EV</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="calculator.html">Calculator</a>
      <a class="nav-link" href="snap-compare.html">Snap &amp; Compare</a>
      <a class="nav-link" href="garage.html">The Garage</a>
      <a class="nav-link" href="concierge.html">Concierge</a>
      <a class="nav-link" href="energy-map.html">Energy Map</a>
    </div>
    <div class="nav-right">
      <div class="toggle" role="group" aria-label="Theme">
        <button data-theme-btn="light" aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
        <button data-theme-btn="dark" aria-label="Dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <div class="avatar-chip"><span class="av">TM</span><span class="nm">Thandi</span></div>
    </div>
    <button class="burger" aria-label="Menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  </div>
</nav>
<div class="mobile-menu">
  <a href="index.html">Home</a><a href="calculator.html">Calculator</a><a href="snap-compare.html">Snap &amp; Compare</a>
  <a href="garage.html">The Garage</a><a href="concierge.html">Concierge</a><a href="energy-map.html">Energy Map</a>
</div>

<div id="root"></div>

<script src="site.js"></script>
<script type="text/babel">
const { useState } = React;
const group = (n) => Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');

function Field({ label, value, onChange, ro, pre, suf, textarea, select, options, type }) {
  return (
    <div className="field">
      <label>{label}</label>
      <div className={'inp' + (ro ? ' ro' : '')}>
        {pre && <span className="pre">{pre}</span>}
        {textarea
          ? <textarea value={value} disabled={ro} onChange={(e)=>onChange&&onChange(e.target.value)} />
          : select
            ? <select value={value} disabled={ro} onChange={(e)=>onChange&&onChange(e.target.value)}>{options.map(o=><option key={o} value={o}>{o}</option>)}</select>
            : <input type={type||'text'} value={value} disabled={ro} onChange={(e)=>onChange&&onChange(e.target.value)} />}
        {suf && <span className="suf">{suf}</span>}
      </div>
    </div>
  );
}
const Sun = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>;
const Moon = () => <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>;

function App() {
  const [edit, setEdit] = useState(false);
  const [p, setP] = useState({ name:'Thandi Mokoena', bio:'Cape Town commuter weighing up the switch. Big on data, allergic to surprises at the pump.',
    make:'VW', model:'Polo 1.0 TSI', year:'2024', type:'ICE' });
  const [prefs, setPrefs] = useState({ km:2000, tariff:3.30, currency:'ZAR (R)' });
  const [theme, setTheme] = useState((document.documentElement.getAttribute('data-theme')||'dark'));
  const up = (k)=>(v)=>setP({...p,[k]:v});
  const upPref = (k)=>(v)=>setPrefs({...prefs,[k]:v});
  const setTh = (t) => { setTheme(t); window.VOLT && window.VOLT.setTheme(t); };

  return (
    <div className="prof">
      <div className="phead">
        <div className="bigav">TM<span className="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M5 8h3l1.5-2h5L16 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></span></div>
        <div className="who">
          <h1>{p.name}</h1>
          <div className="car"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"><path d="M3 13l2-5a2 2 0 0 1 1.9-1.3h10.2A2 2 0 0 1 19 8l2 5v5h-3v-2H6v2H3v-5z"/><circle cx="7.5" cy="15.5" r="1.5"/><circle cx="16.5" cy="15.5" r="1.5"/></svg>
            {p.year} · {p.make} {p.model}<span className="b">{p.type}</span></div>
          <div className="since">Member since March 2025</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={()=>setEdit(!edit)}>{edit?'Done':'Edit profile'}</button>
      </div>

      <div className="pstats">
        <div className="pstat"><div className="v mono-num">6</div><div className="l">Cars in your Garage</div><a href="garage.html">Open Garage →</a></div>
        <div className="pstat"><div className="v mono-num">12</div><div className="l">Comparisons run</div><a href="calculator.html">New comparison →</a></div>
        <div className="pstat"><div className="v mono-num">R28<span className="u">k</span></div><div className="l">Tracked saving / year</div><a href="snap-compare.html">See how →</a></div>
      </div>

      <div className="pgrid">
        <div className="pcard">
          <div className="ch"><h3>Profile details</h3>
            <button className="btn btn-ghost btn-sm" onClick={()=>setEdit(!edit)} style={{height:'36px'}}>{edit?'Save':'Edit'}</button></div>
          <Field label="Display name" value={p.name} onChange={up('name')} ro={!edit} />
          <Field label="Bio" value={p.bio} onChange={up('bio')} ro={!edit} textarea />
          <div className="frow"><Field label="Car make" value={p.make} onChange={up('make')} ro={!edit} /><Field label="Car model" value={p.model} onChange={up('model')} ro={!edit} /></div>
          <div className="frow"><Field label="Year" value={p.year} onChange={up('year')} ro={!edit} type="number" />
            <Field label="Drivetrain" value={p.type} onChange={up('type')} ro={!edit} select options={['ICE','EV','Hybrid','PHEV']} /></div>
        </div>

        <div>
          <div className="pcard">
            <div className="ch"><h3>Switch preferences</h3></div>
            <Field label="Typical monthly distance" value={prefs.km} onChange={upPref('km')} ro={!edit} suf="km" type="number" />
            <div className="frow">
              <Field label="Home electricity tariff" value={prefs.tariff} onChange={upPref('tariff')} ro={!edit} pre="R" suf="/kWh" type="number" />
              <Field label="Currency" value={prefs.currency} onChange={upPref('currency')} ro={!edit} select options={['ZAR (R)','USD ($)','GBP (£)','EUR (€)']} />
            </div>
            <div className="acct-row" style={{borderTop:'1px solid var(--line-2)',marginTop:'6px'}}>
              <div><div className="k">Appearance</div><div className="sub">Used across the app</div></div>
              <div className="theme-inline">
                <button className={theme==='light'?'on':''} onClick={()=>setTh('light')}><Sun/></button>
                <button className={theme==='dark'?'on':''} onClick={()=>setTh('dark')}><Moon/></button>
              </div>
            </div>
          </div>

          <div className="pcard">
            <div className="ch"><h3>Account</h3></div>
            <div className="acct-row"><div><div className="k">thandi@example.co.za</div><div className="sub">Verified email</div></div><button>Change</button></div>
            <div className="acct-row"><div><div className="k">Password</div><div className="sub">Last changed 2 months ago</div></div><button>Update</button></div>
            <div className="acct-row"><div><div className="k">Sign out</div><div className="sub">On this device</div></div><a className="btn btn-ghost btn-sm" href="auth.html" style={{height:'38px'}}>Sign out</a></div>
            <div className="acct-row"><div><div className="k" style={{color:'#ff7a7a'}}>Delete account</div><div className="sub">Permanently remove your data</div></div><button className="danger">Delete</button></div>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
